/* Copeak Study: questions sourced only from the textbook-audited New Words boxes.

(function applyTextbookVocabularyAudit(){
 const audit=(window.COPEAK_NH_AUDIT||{})['grade1']||{};
 for(const unit of Object.keys(DATASETS)){
  const sections=Object.entries(audit).filter(([key])=>key.startsWith(unit+':'));
  if(!sections.length)continue;
  const items=sections.flatMap(([section,data])=>data.words.map((w,index)=>({
   id:'nh1-u'+unit+'-'+section.replace(/[^a-z0-9]+/ig,'-').toLowerCase()+'-'+(index+1),
   word:w.en,jp:w.ja,bookForm:w.en,bookPage:data.page,bookPart:section.split(':').slice(1).join(':'),
   wordClass:w.type,source:'教科書 p.'+data.page+' New Words（照合済み）'
  })));
  if(items.length<4)continue;
  DATASETS[unit].vocab=items;
  DATASETS[unit].spelling=items.filter(x=>x.wordClass==='new' && /^[a-z][a-z'’-]*$/i.test(x.word));
 }
})();

(()=>{'use strict';
const el=document.getElementById('content'),unitList=document.getElementById('units');

let progress={},database=null;let persistStatus='loading';

async function openDB(){try{return await new Promise((resolve,reject)=>{const req=indexedDB.open(dbName,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}catch(e){return null}}

function persist(){if(database){try{database.transaction('state','readwrite').objectStore('state').put(progress,'progress')}catch(e){persistStatus='保存失敗'}}else{try{localStorage.setItem(dbName,JSON.stringify(progress))}catch(e){persistStatus='保存失敗'}}}

const allItems=cat=>state.section!=='all'
 ?(SECTION_PRACTICE[String(state.unit)]?.[state.section]?.[cat]||[])
 :[...(DATASETS[state.unit]?.[cat]||[]),...(SECTION_CATALOG[String(state.unit)]||[]).flatMap(sec=>SECTION_PRACTICE[String(state.unit)]?.[sec.id]?.[cat]||[])];
const items=cat=>{const a=allItems(cat);return state.reviewIds&&state.category===cat ? a.filter(v=>state.reviewIds.includes(v.id)):a};
function sectionTitle(){const part=(SECTION_CATALOG[String(state.unit)]||[]).find(x=>x.id===state.section);return part?part.title+' / p.'+part.pageStart:'Unit '+state.unit+' 全体'}
function sectionTabs(){const parts=SECTION_CATALOG[String(state.unit)]||[];return '<div class="section-tabs" role="group" aria-label="練習するPartを選ぶ">'+
 (state.unit===0?'':'<button class="section-tab '+(state.section==='all'?'selected':'')+'" data-section="all">Unit 全体</button>')+
 parts.map(p=>'<button class="section-tab '+(state.section===p.id?'selected':'')+'" data-section="'+p.id+'">'+esc(p.title)+'</button>').join('')+'</div>'}
function sectionNotice(){const part=(SECTION_CATALOG[String(state.unit)]||[]).find(x=>x.id===state.section);
if(!part)return '<div class="section-note">このUnitのすべてのPartをまとめて練習できます。</div>';
return '<div class="section-note"><strong>'+esc(part.title)+'・教科書 p.'+part.pageStart+'〜</strong>'+
 (part.verified? '教科書のNew Wordsは照合済み。':'語彙の教科書掲載箇所は未照合。')+
 ' 新しい問題はテーマに沿ったオリジナル教材です。</div>'}
function wireSectionTabs(){el.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{stopSpeech();state.section=b.dataset.section;state.category=null;state.reviewIds=null;state.index=0;state.done=false;state.finished=false;state.optionKey=null;state.optionOrder=null;state.slotBags={};render()})}
function metrics(cat){let a=allItems(cat),earned=0,mastered=0,done=0;for(const it of a){const p=getScore(cat,it);earned+=Math.min(2,p.streak);if(p.streak>=2)mastered++;if(p.attempts>0||p.practice>0)done++}return{count:a.length,earned,pct:a.length?Math.round(earned/(a.length*2)*100):0,mastered,done}}
function overall(){let n=0,e=0,m=0;for(const c of CATEGORY_META){const t=metrics(c.id);n+=t.count;e+=t.earned;m+=t.mastered}return{count:n,pct:n?Math.round(e/(n*2)*100):0,mastered:m}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ring(pct,color,size=64){return `<div class="mini-donut" style="width:${size}px;height:${size}px;background:conic-gradient(${color} 0 ${pct}%,#e9f0f2 ${pct}% 100%)"><strong>${pct}%</strong></div>`}

function renderDashboard(){const u=UNIT_META[state.unit];if(!u.ready){el.innerHTML=`<div class="heading"><div><div class="sub">STAGE ${u.stage} / UNIT ${u.id}</div><h1>${esc(u.title)}</h1><p>${esc(u.topic)} · 教科書 p.${u.start}〜</p></div><span class="badge">教材準備中</span></div><div class="placeholder"><div><div class="mark">📚</div><h2>Unit ${u.id} の学習データを整理中</h2><p>教科書の目次・ページ範囲・重点文法の照合を進めています。該当Unitの問題を準備しています。</p><p><b>${esc(u.grammar)}</b></p><button class="primary" id="demo5">Unit 1 を試す</button></div></div>`;document.getElementById('demo5').onclick=()=>selectUnit(1);return;}
const total=overall(),next=CATEGORY_META.filter(x=>metrics(x.id).count).sort((a,b)=>metrics(a.id).pct-metrics(b.id).pct)[0];
el.innerHTML=`<div class="heading"><div><div class="sub">STAGE ${u.stage} / UNIT ${u.id} · PERSONAL STUDY</div><h1>${esc(u.title)}</h1><p>${esc(u.topic)} · 教科書 p.${u.start}〜 / ${esc(u.grammar)}</p></div><span class="badge">学習中 · 8分野</span></div>${sectionTabs()}${sectionNotice()}<div class="dash-intro">${dRing(total.pct)}<div class="introtext"><b>できることが、ひと目でわかる。</b><p>各分野をタップしてタッチ操作で練習。1回正解＝練習中、2回連続正解＝このアプリ内のマスター判定です。</p><div class="stats"><div class="stat"><b>${total.mastered} <small>/ ${total.count}</small></b><small>マスター項目</small></div><div class="stat"><b>${total.count-total.mastered}</b><small>まだ練習できる項目</small></div><div class="stat"><b>${persistStatus==='IndexedDB'?'端末保存':esc(persistStatus)}</b><small>学習記録</small></div></div></div></div><div class="section-head"><strong>学習メニュー</strong><span>タップして始める · iPad最適化</span></div><div class="skills">${CATEGORY_META.map(c=>{const m=metrics(c.id);return `<button class="skill" data-cat="${c.id}">${ring(m.pct,c.color,58)}<div class="skill-text"><strong><span class="skill-icon">${esc(c.icon)}</span>${esc(c.label)}</strong><small>${m.mastered}/${m.count} マスター</small><span class="go">トレーニング →</span></div></button>`}).join('')}</div><div class="notice"><div>次におすすめ：<b>${esc(next.label)}</b>（習得度 ${metrics(next.id).pct}%）を優先して練習</div><button class="outline" id="review-inline">ミスだけ復習 ↻</button><button class="outline" id="backup-inline">記録を保存 ↓</button></div>`;
wireSectionTabs();el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>startCat(b.dataset.cat));document.getElementById('backup-inline').onclick=downloadProgress;document.getElementById('review-inline').onclick=showReviewMenu;
}
function startCat(cat,review=false){if(!allItems(cat).length)return;stopSpeech();state.reviewIds=review?allItems(cat).filter(x=>{const a=getScore(cat,x);return a.attempts>a.correct&&a.streak<2}).map(x=>x.id):null;state.category=cat;state.index=0;state.done=false;state.finished=false;state.seen=0;state.choice=-1;state.optionKey=null;state.optionOrder=null;state.slotBags={};state.speakingResult=null;state.tiles=[];state.chosen=[];state.started=false;render()}

function shuffle(arr,seed){let a=arr.slice(),h=[...String(seed)].reduce((n,c)=>n*31+c.charCodeAt(0),137)&2147483647;for(let i=a.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;let j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function randomOrder(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mcChoices(item,arr,correct,explain){
 const key=[state.unit,state.section,state.category,state.index,item.id,arr.length].join('|');
 if(state.optionKey!==key){
  const options=arr.map((text,i)=>({text,original:i}));
  const answer=options.splice(correct,1)[0];
  if(!state.slotBags[arr.length]?.length)state.slotBags[arr.length]=randomOrder(Array.from({length:arr.length},(_,i)=>i));
  const slot=state.slotBags[arr.length].pop();
  const order=randomOrder(options);order.splice(slot,0,answer);
  state.optionOrder=order;state.optionKey=key;
 }
 const sorted=state.optionOrder||[];
 return '<div class="choices">'+sorted.map(x=>'<button class="choice" data-option="'+x.original+'" data-is="'+(x.original===correct?'yes':'no')+'">'+esc(x.text)+'</button>').join('')+'</div>'+
 '<div class="answer-note '+(state.done?(state.choice===correct?'good':'bad'):'')+'" id="feedback">'+
 (state.done?(state.choice===correct?'✓ 正解！':'↻ もう一度練習しましょう。')+'　'+esc(explain||''):'答えを選んでください。')+'</div>';
}

function actionBar(text='次の問題 →'){return `<div class="actions"><button class="primary" id="next" ${!state.done?'disabled':''}>${text}</button></div>`}
function prompt(label,main,sub=''){return `<div class="prompt-card"><div class="prompt-label">${esc(label)}</div><div class="prompt-main">${esc(main)}</div>${sub?`<div class="prompt-small">${esc(sub)}</div>`:''}</div>`}
function renderPractice(){const a=items(state.category),it=a[state.index],cat=state.category;if(state.finished){const m=metrics(cat);el.innerHTML=`<div class="practice"><div class="practice-head"><button class="back" id="back">← 学習状況</button><div class="practice-title"><strong>${CATEGORY_META.find(x=>x.id===cat).label}</strong><small>今回のトレーニング終了</small></div></div><div class="placeholder"><div><div class="mark">✦</div><h2>よく頑張りました！</h2><div class="qend"><b>${m.pct}%</b><small>この分野の習得進捗</small></div><p>${m.mastered}/${m.count} 項目をマスター。次に同じ練習を行うと、再現できた項目が増えていきます。</p><div class="hand-opts" style="justify-content:center"><button id="redo" class="outline">もう一度練習</button><button id="dash" class="primary">学習状況へ</button></div></div></div></div>`;document.getElementById('back').onclick=document.getElementById('dash').onclick=toDash;document.getElementById('redo').onclick=()=>startCat(cat);return}
let b='';
if(cat==='vocab'){const arr=[it.jp,...shuffle(allItems('vocab').filter(x=>x.id!==it.id).map(x=>x.jp).filter(x=>x!==it.jp),it.id).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)];const reverse=(state.index%3===2);let choices=reverse?[it.word,...shuffle(allItems('vocab').filter(x=>x.id!==it.id).map(x=>x.word).filter(x=>x!==it.word),it.id).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)]:arr;b=prompt(reverse?'日本語に合う英語を選ぼう':'英単語の意味を選ぼう',reverse?it.jp:it.word,reverse?'日本語 → 英語':'英語 → 日本語')+mcChoices(it,choices,0,`正解：${it.word} — ${it.jp}`)+actionBar()}
if(cat==='listening'){b=`<div class="prompt-card"><div class="prompt-label">音声を聞いて答えよう</div><button class="audio-btn" id="play">♫　英文を聞く</button><div class="prompt-small">${esc(it.prompt)}はどれ？</div></div>`+mcChoices(it,it.choices,it.correct,'英文：'+it.tts)+actionBar()}
if(cat==='meaning'){b=prompt(it.prompt,it.en)+mcChoices(it,it.choices,it.correct,'日本語訳：'+it.choices[it.correct])+actionBar()}
if(cat==='grammar'){b=prompt('空欄に入る正しい語句を選ぼう',it.sentence)+mcChoices(it,it.choices,it.correct,it.explain)+actionBar()}
if(cat==='reading'){b=`<div class="prompt-card" style="align-items:stretch;text-align:left;min-height:145px"><div class="prompt-label">${esc(it.label)} · 教科書と同じテーマのオリジナル短文</div><div class="story-text">${esc(it.en)}</div>${state.done?`<div class="story-jp">${esc(it.jp)}</div>`:''}</div><div class="topic-label">${esc(it.question)}</div>`+mcChoices(it,it.choices,it.correct,'')+actionBar()}
if(cat==='spelling'){b=spellView(it)}
if(cat==='ordering'){b=orderView(it)}
if(cat==='speaking'){b=speakView(it)}
el.innerHTML=`<div class="practice">${baseHead()}<div class="questionarea">${b}</div><div class="footer">正誤と練習回数をこの端末に保存します。合成音声・音読認識は端末とネット環境に依存します。</div></div>`;
document.getElementById('back').onclick=toDash;
const nx=document.getElementById('next');if(nx)nx.onclick=()=>{if(state.done)nextItem()};
if(['vocab','listening','meaning','grammar','reading'].includes(cat))wireMC(it,cat);
if(cat==='listening'){document.getElementById('play').onclick=()=>speakText(it.tts)}
if(cat==='spelling')wireSpelling(it);
if(cat==='ordering')wireOrdering(it);
if(cat==='speaking')wireSpeaking(it);
}
function wireMC(it,cat){el.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(state.done)return;let guess=Number(b.dataset.option);state.done=true;state.choice=guess;record(cat,it,guess===((cat==='vocab'||cat==='spelling')?0:it.correct));render()})}
function speakText(s,rate=.86){if(!window.speechSynthesis){alert('この端末では音声合成を利用できません。');return}speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(s);msg.lang='en-US';msg.rate=rate;msg.pitch=1;const vs=speechSynthesis.getVoices(),v=vs.find(v=>/^en/i.test(v.lang)&&/Samantha|Alex|Daniel/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang));if(v)msg.voice=v;speechSynthesis.speak(msg)}
function orderView(it){if(!state.tiles.length){state.tiles=shuffle(it.answer.map((t,i)=>({text:t,id:i})),it.id+'order');state.chosen=[]}let text=state.chosen.map(i=>it.answer[i]).join(' ');return `${prompt('日本語を見て英文を組み立てよう',it.jp)}<div class="writing-slot">${state.chosen.length?state.chosen.map((i,j)=>`<button class="tile in-slot" data-undo="${j}">${esc(it.answer[i])}</button>`).join(''):'単語を順番にタップしてね'}</div><div class="wordtiles">${state.tiles.filter(o=>!state.chosen.includes(o.id)).map(o=>`<button class="tile" data-pick="${o.id}">${esc(o.text)}</button>`).join('')}</div><div class="answer-note ${state.done?(text===it.answer.join(' ')?'good':'bad'):''}">${state.done?esc(text===it.answer.join(' ')?'✓ 正解！':'正解：'+it.answer.join(' ')):'すべての語句を選んだら「判定する」を押そう。'}</div><div class="actions"><button id="reset-tiles" class="outline">やり直す</button><button id="check-tiles" class="primary" ${state.done?'disabled':''}>判定する</button>${state.done?'<button id="next" class="primary">次へ →</button>':''}</div>`}
function wireOrdering(it){el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(state.done)return;state.chosen.push(+b.dataset.pick);renderPractice()});el.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{if(state.done)return;state.chosen.splice(+b.dataset.undo,1);renderPractice()});document.getElementById('reset-tiles').onclick=()=>{if(state.done)return;state.chosen=[];renderPractice()};document.getElementById('check-tiles').onclick=()=>{if(state.done)return;if(state.chosen.length!==it.answer.length){alert('すべての単語を並べてください。');return}state.done=true;record('ordering',it,state.chosen.map(i=>it.answer[i]).join(' ')===it.answer.join(' '));renderPractice()}}
function spellingChoices(it){
 const word=String(it.word||'').toLowerCase();
 const known=new Set(allItems('vocab').map(v=>String(v.word||'').toLowerCase()));
 const result=[word],seen=new Set(result);
 function add(str){
  if(str===word||str.length<2||seen.has(str)||known.has(str)||!/^[a-z]+$/.test(str))return;
  seen.add(str);result.push(str);
 }
 for(let i=0;i<word.length-1;i++)if(word[i]!==word[i+1])add(word.slice(0,i)+word[i+1]+word[i]+word.slice(i+2));
 for(let i=1;i<word.length;i++)add(word.slice(0,i)+word.slice(i+1));
 for(let i=1;i<word.length;i++)add(word.slice(0,i)+word[i]+word.slice(i));
 for(let i=0;i<word.length;i++)if('aeiou'.includes(word[i]))for(const vowel of 'aeiou')if(vowel!==word[i])add(word.slice(0,i)+vowel+word.slice(i+1));
 for(let i=0;i<word.length;i++){const c=word[i],alt=c==='r'?'l':c==='e'?'a':c==='s'?'c':'e';add(word.slice(0,i)+alt+word.slice(i+1));}
 if(result.length<4)throw new Error('Cannot make spelling distractors for '+word);
 return result.slice(0,4);
}
function spellView(it){return prompt('正しいスペルを選ぼう',it.jp,'似ている綴りの中から正しい英単語を選びましょう。')+
 '<div class="hand-opts"><button id="spell-audio" class="small-tool">♫ 発音</button></div>'+
 mcChoices(it,spellingChoices(it),0,'正しいスペル：'+it.word)+actionBar()}
function wireSpelling(it){document.getElementById('spell-audio').onclick=()=>speakText(it.word,.76);wireMC(it,'spelling')}
function speakView(it){return `${prompt('例文を音読しよう',it.en,it.jp)}<div class="qend" style="min-height:80px"><button id="hear-model" class="audio-btn">♫　お手本を聞く</button><button id="speak-record" class="primary">${state.started?'■ 判定する':'● 音読スタート'}</button></div><div class="answer-note ${state.done?'good':''}">${state.speakingResult||'マイク許可が必要です。対応ブラウザでは音声認識結果を原文と照合します。非対応の場合は練習のみ記録します。'}</div><div class="actions">${state.done?'<button id="next" class="primary">次へ →</button>':`<button id="selfpractice" class="outline">音読だけ記録して次へ</button>`}</div>`}
function stopSpeech(){if(state.rec){try{state.rec.abort()}catch(e){}state.rec=null}state.started=false}
function compareSpeech(expected,spoken){const a=expected.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean),b=spoken.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean),n=a.length,m=b.length;let dp=Array.from({length:n+1},(_,i)=>Array.from({length:m+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return Math.max(0,Math.round((1-dp[n][m]/Math.max(1,n,m))*100))}
function wireSpeaking(it){document.getElementById('hear-model').onclick=()=>speakText(it.en,.81);document.getElementById('selfpractice')?.addEventListener('click',()=>{record('speaking',it,false,'practice');nextItem()});const recButton=document.getElementById('speak-record');recButton.onclick=()=>{if(state.done)return;if(state.started){try{state.rec.stop()}catch(e){}return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.speakingResult='音声認識が使えません。音読練習だけ記録して次へ進めます。';renderPractice();return}const rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;state.rec=rec;state.started=true;rec.onresult=e=>{const transcript=e.results?.[0]?.[0]?.transcript||'';const acc=compareSpeech(it.en,transcript);const correct=acc>=85;state.speakingResult=`認識：「${esc(transcript)}」 / 一致度 ${acc}%　${correct?'✓ 合格':'もう一度練習'}`;state.done=true;state.started=false;record('speaking',it,correct);renderPractice()};rec.onerror=e=>{state.started=false;state.speakingResult='音声認識を完了できませんでした（'+esc(e.error||'不明')+'）。お手本を聞いて再挑戦してください。';renderPractice()};rec.onend=()=>{state.started=false;if(document.getElementById('speak-record'))document.getElementById('speak-record').textContent='● 音読スタート'};try{rec.start();recButton.textContent='■ 判定する'}catch(e){state.started=false;state.speakingResult='音声認識を開始できませんでした。';renderPractice()}}}
function toDash(){stopSpeech();state.category=null;state.reviewIds=null;state.finished=false;render()}
function showReviewMenu(){
 const counts=CATEGORY_META.map(c=>({...c,n:allItems(c.id).filter(x=>{const p=getScore(c.id,x);return p.attempts>p.correct&&p.streak<2}).length})).filter(x=>x.n>0);
 if(!counts.length){alert('まだ間違いとして記録された問題はありません。各分野の練習から始めてください。');return}
 const cover=document.createElement('div');cover.style='position:fixed;inset:0;z-index:999;background:rgba(19,43,53,.35);display:grid;place-items:center;padding:15px';
 cover.innerHTML=`<div style="width:min(90vw,400px);background:white;border-radius:20px;padding:17px"><div style="display:flex;justify-content:space-between;align-items:center"><strong>間違えた問題の復習</strong><button id="reviewclose" class="outline">閉じる</button></div><div style="display:grid;gap:8px;margin-top:14px">${counts.map(c=>`<button class="choice" style="min-height:50px;text-align:left" data-review="${c.id}">${esc(c.label)}　<span style="color:#78909a;font-size:11px">${c.n}問の復習</span></button>`).join('')}</div></div>`;
 document.body.appendChild(cover);cover.onclick=e=>{if(e.target===cover)cover.remove()};cover.querySelector('#reviewclose').onclick=()=>cover.remove();cover.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const cat=b.dataset.review;cover.remove();startCat(cat,true)})
}
function showUnitMenu(){
let old=document.getElementById('unit-overlay');if(old){old.remove();return}
const cover=document.createElement('div');cover.id='unit-overlay';cover.style='position:fixed;inset:0;z-index:999;background:rgba(19,43,53,.35);display:grid;place-items:center;padding:15px;';
cover.innerHTML=`<div style="width:min(92vw,480px);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:18px;box-shadow:0 18px 60px #1335"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><strong>Unitを選択</strong><button id="closeunit" class="outline">閉じる ✕</button></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${UNIT_META.map(u=>`<button class="choice" data-select-unit="${u.id}" style="min-height:64px;text-align:left"><b>Unit ${u.id}</b><br><span style="font-size:11px;color:#75939a">${esc(u.title)}</span></button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="outline" id="overlay-export">記録を保存 ↓</button><button class="outline" id="overlay-import">記録を復元 ↑</button></div></div>`;
document.body.appendChild(cover);cover.onclick=e=>{if(e.target===cover)cover.remove()};cover.querySelector('#closeunit').onclick=()=>cover.remove();cover.querySelectorAll('[data-select-unit]').forEach(b=>b.onclick=()=>{const n=+b.dataset.selectUnit;cover.remove();selectUnit(n)});cover.querySelector('#overlay-export').onclick=()=>{cover.remove();downloadProgress()};cover.querySelector('#overlay-import').onclick=()=>{cover.remove();document.getElementById('import-file').click()};
}
function downloadProgress(){const data={format:'Copeak Grade 1 Study Backup',version:1,exportedAt:new Date().toISOString(),progress};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='copeak-study-grade1-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importProgress(f){if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.format!=='Copeak Grade 1 Study Backup'||typeof data.progress!=='object'||!data.progress)throw new Error('形式が違います');const cleaned={};for(const [key,score] of Object.entries(data.progress)){if(!/^u(?:10|[0-9])\|(vocab|listening|meaning|grammar|speaking|spelling|ordering|reading)\|[a-z0-9-]+$/i.test(key))continue;if(!score||typeof score!=='object')continue;cleaned[key]={streak:Math.max(0,Math.min(2,Number(score.streak)||0)),attempts:Math.max(0,Number(score.attempts)||0),correct:Math.max(0,Number(score.correct)||0),practice:Math.max(0,Number(score.practice)||0),last:typeof score.last==='string'?score.last:null}}if(confirm('現在の学習記録をバックアップの記録に置き換えますか？')){progress=cleaned;persist();toDash();alert('学習記録を復元しました。')}}catch(e){alert('学習記録の読み込みに失敗しました。')}};reader.readAsText(f)}
document.getElementById('home-top').onclick=toDash;document.getElementById('unit-menu').onclick=showUnitMenu;document.getElementById('export').onclick=downloadProgress;document.getElementById('import').onclick=()=>document.getElementById('import-file').click();document.getElementById('import-file').onchange=e=>importProgress(e.target.files[0]);init();
})();

</script>
