name: Copeak bilingual semantic QA (draft correction)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/review_ja_translations.mjs'
      - 'data/ja-quality-templates-v1.json'
      - '.github/workflows/ja-quality-revision.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: copeak-bilingual-qa
  cancel-in-progress: false
jobs:
  correct-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct Japanese drafts with source aligned sentence frames
        run: node scripts/review_ja_translations.mjs
      - name: Validate sentence coverage, ids and UI
        run: |
          node tests/ja_translations_5000.test.mjs
          node tests/v8_2_results.test.mjs
          node tests/v8_4_review.test.mjs
          git diff --check
      - name: Commit validated translation quality revisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chunks-v7-level-*.json data/v8-2-example-ja.json data/ja-quality-audit-v1-report.json
          git diff --cached --quiet && exit 0
          git commit -m "data(vocab): improve Japanese sentence fidelity with 164 frames and 62 guided repairs"
          git push origin HEAD:main
