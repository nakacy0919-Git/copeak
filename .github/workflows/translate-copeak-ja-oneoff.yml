name: Generate Japanese example translations (one-off)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/translate_copeak_examples.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: copeak-ja-translation-oneoff
  cancel-in-progress: true
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install translation engine
        run: python -m pip install 'argostranslate==1.10.0'
      - name: Generate and validate all translations
        run: python scripts/translate_copeak_examples.py
      - name: Commit translated data without redeploying
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chunks-v7-level-*.json data/v8-2-example-ja.json data/ja-backfill-v8-4-report.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "data(vocab): backfill 5000 en-ja sentence drafts with coverage report"
          git push origin HEAD:main
