<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copeak Sound Quest</title>
    <script src="sq-data.js"></script>
    <script src="sq-liaison-data.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #faf8f5; }
        .serif-font { font-family: 'Lora', serif; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .recording-ripple { animation: ripple 1.5s infinite; }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; filter: blur(4px); } 100% { transform: scale(1); opacity: 1; filter: blur(0); } }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes successPop { 0% { transform: scale(1); } 50% { transform: scale(1.15); color: #059669; text-shadow: 0px 4px 10px rgba(5, 150, 105, 0.3); } 100% { transform: scale(1); } }
        .animate-success-pop { animation: successPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .iron-border { border: 2px solid #e5e5e5; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen text-stone-800 flex flex-col selection:bg-emerald-200 relative z-0">
    
    <header class="w-full px-4 py-3 md:px-6 md:py-3 border-b border-stone-200 bg-white/95 backdrop-blur-md sticky top-0 z-50 shadow-sm flex flex-col transition-all duration-300">
        <div class="flex justify-between items-center w-full max-w-6xl mx-auto">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Copeak" class="w-6 h-6 md:w-8 md:h-8 object-contain" onerror="this.style.display='none'">
                <h1 class="text-lg md:text-xl font-black tracking-widest text-stone-800 serif-font mt-1">
                    COPEAK <span class="text-emerald-600">SOUND QUEST</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-2 md:gap-3">
                <button id="btnSkip" onclick="skipPhase()" class="hidden px-2 py-1.5 md:px-3 md:py-2 bg-stone-100 hover:bg-stone-200 text-stone-500 hover:text-stone-700 text-[10px] md:text-xs font-bold rounded-md shadow-sm border border-stone-200 transition flex items-center gap-1" title="次のステージへ進む">
                    <span>⏩</span> <span class="hidden sm:inline">スキップ</span>
                </button>
                <div id="btnDivider" class="hidden w-px h-6 bg-stone-300 mx-0.5 md:mx-1 sm:block"></div>
                <button id="btnHome" onclick="returnToSoundQuestHome()" class="hidden px-3 py-1.5 md:px-4 md:py-2 bg-white hover:bg-emerald-50 hover:border-emerald-200 text-stone-600 hover:text-emerald-700 text-[10px] md:text-xs font-bold rounded-full shadow-sm border border-stone-200 transition flex items-center gap-1.5">
                    <span>🎧</span> <span class="hidden sm:inline">コース選択へ</span>
                </button>
                <button onclick="window.location.href='index.html'" class="px-3 py-1.5 md:px-4 md:py-2 bg-stone-800 hover:bg-stone-700 text-white text-[10px] md:text-xs font-bold rounded-full shadow-sm transition flex items-center gap-1.5">
                    <span>🏠</span> <span class="hidden sm:inline">Copeak本体へ</span>
                </button>
            </div>
        </div>
        
        <div id="progressContainer" class="hidden w-full max-w-xl mx-auto mt-3 md:mt-4 mb-1"></div>
    </header>

    <main id="sqAppContainer" class="flex-1 w-full max-w-6xl mx-auto p-4 md:p-6 flex flex-col justify-center relative z-10"></main>

    <!-- 完了モーダル -->
    <div id="transferModal" class="hidden fixed inset-0 z-[20000] bg-stone-900/60 flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white border-4 border-emerald-400 rounded-3xl p-8 md:p-12 shadow-2xl max-w-lg w-full text-center animate-pop-in relative overflow-hidden">
            <h2 class="text-xs font-black tracking-[0.3em] text-emerald-600 mb-4 uppercase">Mission Complete!</h2>
            <div class="text-5xl md:text-6xl mb-3 drop-shadow-md animate-bounce">👑</div>
            <h3 class="text-2xl md:text-3xl font-black text-stone-800 mb-2 serif-font tracking-tight leading-tight">READY FOR<br>COPEAK TRANSFER</h3>
            <p class="text-stone-500 font-bold text-xs md:text-sm mt-4 mb-8 leading-relaxed">
                ターゲット音の聞き分けと発音を習得しました！<br>この感覚を持ったまま、Copeak本体へ進みましょう。
            </p>
            <div class="flex flex-col gap-3">
                <button onclick="returnToSoundQuestHome()" class="w-full py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-sm md:text-base rounded-full shadow-sm transition border border-stone-300 flex items-center justify-center gap-2">
                    別の特訓に挑戦する ➔
                </button>
                <button onclick="executeCopeakTransfer()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base md:text-lg rounded-full shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                    Copeak 本編へ戻る 🚀
                </button>
            </div>
        </div>
    </div>

    <script>
        function executeCopeakTransfer() {
            let dataObj = phraseSession.data || (passageSession && passageSession.data);
            if (!dataObj) { window.location.href = 'index.html'; return; }
            const c = getCurrentCourse();
            const transferData = { title: "Sound Quest: " + c.title, eng: dataObj.text, jpn: dataObj.translation || "" };
            sessionStorage.setItem('copeak_sq_transfer', JSON.stringify(transferData));
            window.location.href = 'index.html';
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playGentleSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.05); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05); osc.start(now); osc.stop(now + 0.05);
            } 
            else if (type === 'correct') { 
                const freqs = [523.25, 659.25, 1046.50]; 
                freqs.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + i * 0.08); gain.gain.setValueAtTime(0, now + i * 0.08); gain.gain.linearRampToValueAtTime(0.1, now + i * 0.08 + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.4);
                });
            } 
            else if (type === 'incorrect') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2); osc.start(now); osc.stop(now + 0.2);
            }
        }
        
        function playFanfare() {
            if (audioCtx.state === 'suspended') audioCtx.resume(); const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99].forEach(freq => { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.1, now + 0.1); gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5); osc.start(now); osc.stop(now + 1.5); });
        }
        
        function fireSmallConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 40, spread: 70, origin: { y: 0.65 }, colors: ['#10b981', '#fbbf24', '#3b82f6'], zIndex: 200000, disableForReducedMotion: true });
            }
        }

        document.addEventListener('click', (e) => { if (e.target.closest('button')) playGentleSound('click'); });

        const SoundQuestState = { HOME: "home", INTRO: "intro", EAR_CHECK: "ear_check", EAR_RESULT: "ear_result", VOICE_CHECK: "voice_check", COACHING: "coaching", WORD_PRACTICE: "word_practice", PHRASE_BRIDGE: "phrase_bridge", SENTENCE_MISSION: "sentence_mission", PASSAGE_MISSION: "passage_mission", PASSAGE_RESULT: "passage_result" };
        let currentState = SoundQuestState.HOME;
        
        let currentCourseType = 'minimal'; 
        let currentCourseId = "l-r";
        
        // ★追加: 解説（図鑑）へ直行したかどうかのフラグ
        let isDirectCoaching = false;
        let directCoachingTargetIsA = true;

        let earCheckSession = { questions: [], currentIndex: 0, score: 0, combo: 0, isAnswering: false };
        let voiceCheckSession = { currentPairIndex: 0, currentTargetIsA: true, isRecording: false, resultStatus: null, alternativesData: [], isRetry: false, previousStatus: null, previousTranscript: "" };
        let phraseSession = { data: null, isRecording: false, resultStatus: null, matchedWords: 0, alternativesData: [] };
        let wordPracticeSession = { listWords: [], currentIndex: 0, isRecording: false, resultStatus: null, alternativesData: [] };
        let passageSession = { data: null, isRecording: false, accuracy: 0, alternativesData: [] };
        
        let passageTranscript = "";

        function getCurrentCourse() {
            return currentCourseType === 'minimal' ? courses[currentCourseId] : liaisonCourses[currentCourseId];
        }
        
        // ★修正: 直行モード時は直行用のタブ（TargetIsA）を優先して読み込む
        function getCurrentCoaching() {
            if (currentCourseType === 'minimal') {
                const c = courses[currentCourseId];
                const targetIsA = isDirectCoaching ? directCoachingTargetIsA : voiceCheckSession.currentTargetIsA;
                const coachSymbolKey = targetIsA ? c.coachA : c.coachB;
                return coachingData[coachSymbolKey] || coachingData["l"];
            } else {
                return liaisonCoachingData[currentCourseId] || { title: "準備中", theme: "slate", howTo: "", tips: "", wordLists: [] };
            }
        }

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let sqRecognition = null;
        if (window.SpeechRecognition) {
            sqRecognition = new SpeechRecognition(); 
            sqRecognition.lang = 'en-US'; 
            sqRecognition.continuous = false; 
            sqRecognition.interimResults = false; 
            sqRecognition.maxAlternatives = 10;

            sqRecognition.onresult = (e) => { 
                if (currentState === SoundQuestState.PASSAGE_MISSION) {
                    let fullText = "";
                    for(let i=0; i<e.results.length; i++) {
                        fullText += e.results[i][0].transcript + " ";
                    }
                    passageTranscript = fullText;
                } else {
                    const results = e.results[0]; 
                    let alts = []; 
                    for (let i = 0; i < results.length; i++) alts.push({ transcript: results[i].transcript, confidence: results[i].confidence }); 
                    handleVoiceRecognitionResult(alts); 
                }
            };
            sqRecognition.onerror = (e) => { 
                if (currentState === SoundQuestState.VOICE_CHECK) voiceCheckSession.isRecording = false; 
                else if (currentState === SoundQuestState.WORD_PRACTICE) wordPracticeSession.isRecording = false;
                else if (currentState === SoundQuestState.PASSAGE_MISSION) passageSession.isRecording = false;
                else phraseSession.isRecording = false; 
                renderScreen(); 
            };
            sqRecognition.onend = () => { 
                if (currentState === SoundQuestState.PASSAGE_MISSION && passageSession.isRecording) {
                    handlePassageResult(passageTranscript);
                } else {
                    if (voiceCheckSession.isRecording) voiceCheckSession.isRecording = false; 
                    if (wordPracticeSession.isRecording) wordPracticeSession.isRecording = false; 
                    if (phraseSession.isRecording) phraseSession.isRecording = false; 
                    renderScreen(); 
                }
            };
        }

        function normalizeSpeechText(text = "") { 
            return text.toLowerCase()
                       .replace(/[_‿/]/g, " ") 
                       .replace(/[.,!?;:"“”‘’()[\]{}-]/g, "") 
                       .replace(/\s+/g, " ")
                       .trim(); 
        }

        function skipPhase() {
            if (currentState === SoundQuestState.HOME || isDirectCoaching) { returnToSoundQuestHome(); return; } // 直行モードのスキップはホームへ
            else if (currentState === SoundQuestState.INTRO) { 
                if (currentCourseType === 'minimal') startEarCheck(); 
                else { openCoaching(); }
            }
            else if (currentState === SoundQuestState.EAR_CHECK) { earCheckSession.score = 8; currentState = SoundQuestState.EAR_RESULT; }
            else if (currentState === SoundQuestState.EAR_RESULT) { startVoiceCheck(); }
            else if (currentState === SoundQuestState.VOICE_CHECK || currentState === SoundQuestState.COACHING || currentState === SoundQuestState.WORD_PRACTICE) { startPhraseBridge(); }
            else if (currentState === SoundQuestState.PHRASE_BRIDGE) { startSentenceMission(); }
            else if (currentState === SoundQuestState.SENTENCE_MISSION) { 
                if (currentCourseType === 'liaison') startPassageMission();
                else showCompletionModal(); 
            }
            else if (currentState === SoundQuestState.PASSAGE_MISSION || currentState === SoundQuestState.PASSAGE_RESULT) { showCompletionModal(); }
            renderScreen();
        }

        function returnToSoundQuestHome() { 
            document.getElementById('transferModal').classList.add('hidden'); 
            isDirectCoaching = false; // ★ホームに戻る時はリセット
            currentState = SoundQuestState.HOME; 
            renderScreen(); 
        }
        
        function selectCourse(type, courseId) { 
            isDirectCoaching = false;
            currentCourseType = type; 
            currentCourseId = courseId; 
            currentState = SoundQuestState.INTRO; 
            renderScreen(); 
        }
        
        // ★追加: ホームから直接解説へ飛ぶ関数
        function openDirectCoaching(type, courseId) {
            currentCourseType = type;
            currentCourseId = courseId;
            isDirectCoaching = true;
            directCoachingTargetIsA = true; // デフォルトはAを表示
            currentState = SoundQuestState.COACHING;
            renderScreen();
        }

        function startEarCheck() {
            earCheckSession = { questions: [], currentIndex: 0, score: 0, combo: 0, isAnswering: false }; 
            const c = getCurrentCourse();
            const pairs = c.pairs;
            for (let i = 0; i < 8; i++) {
                const pair = pairs[Math.floor(Math.random() * pairs.length)]; 
                const targetIsA = Math.random() < 0.5;
                const putCorrectLeft = Math.random() < 0.5;
                const correctWord = targetIsA ? pair.wordA : pair.wordB;
                const wrongWord = targetIsA ? pair.wordB : pair.wordA;
                earCheckSession.questions.push({ pair, correctWord, wordLeft: putCorrectLeft ? correctWord : wrongWord, wordRight: putCorrectLeft ? wrongWord : correctWord });
            }
            currentState = SoundQuestState.EAR_CHECK; renderScreen(); setTimeout(playTextAudio, 500);
        }
        
        function playTextAudio(textOverride = null) {
            let text = textOverride;
            let audioPath = null;
            let isWordList = false;

            if (text) {
                isWordList = true;
            }

            if (!text) {
                if (currentState === SoundQuestState.EAR_CHECK) {
                    text = earCheckSession.questions[earCheckSession.currentIndex].correctWord;
                }
                else if (currentState === SoundQuestState.VOICE_CHECK) {
                    const c = getCurrentCourse();
                    text = voiceCheckSession.currentTargetIsA ? c.pairs[voiceCheckSession.currentPairIndex].wordA : c.pairs[voiceCheckSession.currentPairIndex].wordB;
                }
                else if (currentState === SoundQuestState.WORD_PRACTICE) {
                    text = wordPracticeSession.listWords[wordPracticeSession.currentIndex];
                    isWordList = true;
                }
                else if (currentState === SoundQuestState.PHRASE_BRIDGE || currentState === SoundQuestState.SENTENCE_MISSION) {
                    text = phraseSession.data.text;
                    if (currentCourseType === 'liaison') {
                        const prefixMap = { "linking": "link", "reduction": "redu", "silent-letters": "sile", "magic-e": "mage", "assimilation": "assi", "glottal-t": "glot" };
                        const prefix = prefixMap[currentCourseId];
                        if (prefix) {
                            const isPhrase = currentState === SoundQuestState.PHRASE_BRIDGE;
                            const c = getCurrentCourse();
                            const list = isPhrase ? c.phrases : c.sentences;
                            const idx = list.findIndex(item => item.text === text);
                            if (idx !== -1) audioPath = `audio/liaison/${prefix}_${isPhrase ? 'p' : 's'}${idx + 1}.mp3`;
                        }
                    }
                }
                else if (currentState === SoundQuestState.PASSAGE_MISSION) {
                    text = passageSession.data.text;
                    if (currentCourseType === 'liaison') {
                        const prefixMap = { "linking": "link", "reduction": "redu", "silent-letters": "sile", "magic-e": "mage", "assimilation": "assi", "glottal-t": "glot" };
                        const prefix = prefixMap[currentCourseId];
                        if (prefix) {
                            const c = getCurrentCourse();
                            const idx = (c.passages || []).findIndex(item => item.text === text);
                            if (idx !== -1) {
                                audioPath = `audio/liaison/${prefix}_pass${idx + 1}.mp3`;
                            } else {
                                audioPath = `audio/liaison/${prefix}_pass1.mp3`; 
                            }
                        }
                    }
                }
            }

            if (!audioPath && isWordList && currentCourseType === 'liaison') {
                const safeName = text.toLowerCase().replace(/['?.,!]/g, '').replace(/\s*\/\s*/g, '_').replace(/\s+/g, '_');
                audioPath = `audio/liaison/${safeName}.mp3`;
            }

            if (audioPath) {
                const audio = new Audio(audioPath);
                audio.onerror = () => { console.warn("⚠️ MP3 file not found, falling back to AI Voice (TTS):", audioPath); playTTS(text); };
                audio.play().catch(e => { console.warn("⚠️ Autoplay blocked or error:", e); playTTS(text); });
            } else {
                playTTS(text);
            }
        }

        function playTTS(text) {
            const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'en-US'; utterance.rate = 0.85; 
            window.speechSynthesis.cancel(); window.speechSynthesis.speak(utterance);
        }

        function handleEarCheckAnswer(sw, btn) {
            if (earCheckSession.isAnswering) return;
            earCheckSession.isAnswering = true; const q = earCheckSession.questions[earCheckSession.currentIndex]; const isCorrect = (sw === q.correctWord);
            const fb = document.getElementById('earFeedbackArea');
            if (isCorrect) {
                playGentleSound('correct'); fireSmallConfetti(); earCheckSession.score++; earCheckSession.combo++;
                btn.classList.replace('border-stone-200', 'border-emerald-400'); btn.classList.add('bg-emerald-50', 'text-emerald-700', 'shadow-md');
                fb.innerHTML = `<span class="text-emerald-600 font-black text-lg md:text-xl animate-bounce inline-block drop-shadow-sm">✨ Great listening!</span>`;
            } else {
                playGentleSound('incorrect'); earCheckSession.combo = 0; 
                btn.classList.replace('border-stone-200', 'border-amber-400'); btn.classList.add('bg-amber-50', 'text-amber-700');
                fb.innerHTML = `<span class="text-amber-600 font-bold text-base md:text-lg">Listen again.</span>`; setTimeout(() => playTextAudio(q.correctWord), 300);
            }
            document.getElementById('comboDisplay').innerText = earCheckSession.combo > 1 ? `${earCheckSession.combo} COMBO🔥` : '';
            setTimeout(() => {
                earCheckSession.currentIndex++; earCheckSession.isAnswering = false;
                if (earCheckSession.currentIndex >= 8) currentState = SoundQuestState.EAR_RESULT;
                renderScreen(); if (currentState === SoundQuestState.EAR_CHECK) setTimeout(playTextAudio, 300);
            }, 1500);
        }

        function startVoiceCheck() { 
            const c = getCurrentCourse();
            voiceCheckSession = { currentPairIndex: Math.floor(Math.random() * c.pairs.length), currentTargetIsA: Math.random() < 0.5, isRecording: false, resultStatus: null, alternativesData: [], isRetry: false, previousStatus: null, previousTranscript: "" }; 
            currentState = SoundQuestState.VOICE_CHECK; renderScreen(); 
        }
        function openCoaching(forceStatus = null, forceTranscript = null) { 
            if(!isDirectCoaching) {
                voiceCheckSession.previousStatus = forceStatus || voiceCheckSession.resultStatus; 
                voiceCheckSession.previousTranscript = forceTranscript || (voiceCheckSession.alternativesData[0] ? voiceCheckSession.alternativesData[0].transcript : '...'); 
            }
            currentState = SoundQuestState.COACHING; renderScreen(); 
        }
        function startVoiceRetry() { voiceCheckSession.isRetry = true; voiceCheckSession.resultStatus = null; voiceCheckSession.isRecording = false; voiceCheckSession.alternativesData = []; currentState = SoundQuestState.VOICE_CHECK; renderScreen(); }
        
        function startPhraseBridge() { 
            const c = getCurrentCourse();
            phraseSession = { data: c.phrases[Math.floor(Math.random()*c.phrases.length)], isRecording: false, resultStatus: null, matchedWords: 0, alternativesData: [] }; 
            currentState = SoundQuestState.PHRASE_BRIDGE; renderScreen(); 
        }
        function startSentenceMission() { 
            const c = getCurrentCourse();
            phraseSession = { data: c.sentences[Math.floor(Math.random()*c.sentences.length)], isRecording: false, resultStatus: null, matchedWords: 0, alternativesData: [] }; 
            currentState = SoundQuestState.SENTENCE_MISSION; renderScreen(); 
        }
        
        function startPassageMission() {
            const c = getCurrentCourse();
            const dummyPassage = { text: "No passage data found. Please add it to sq-liaison-data.js.", translation: "データ未登録", displayHtml: "" };
            const passages = c.passages || [dummyPassage];
            passageSession = { data: passages[0], isRecording: false, accuracy: 0, alternativesData: [] }; 
            currentState = SoundQuestState.PASSAGE_MISSION; renderScreen(); 
        }

        function openWordPractice(listIndex, wordIndex) {
            const coach = getCurrentCoaching();
            wordPracticeSession = { listWords: coach.wordLists[listIndex].words, currentIndex: wordIndex, isRecording: false, resultStatus: null, alternativesData: [] };
            currentState = SoundQuestState.WORD_PRACTICE; renderScreen();
        }

        function navWordPractice(direction) {
            if (direction === 'next' && wordPracticeSession.currentIndex < wordPracticeSession.listWords.length - 1) wordPracticeSession.currentIndex++;
            else if (direction === 'prev' && wordPracticeSession.currentIndex > 0) wordPracticeSession.currentIndex--;
            wordPracticeSession.resultStatus = null; wordPracticeSession.alternativesData = []; renderScreen();
        }

        function toggleMic() {
            if (!sqRecognition) { alert("マイクでの音声認識に非対応です。"); return; }
            let isRec = false;
            if (currentState === SoundQuestState.VOICE_CHECK) isRec = voiceCheckSession.isRecording;
            else if (currentState === SoundQuestState.WORD_PRACTICE) isRec = wordPracticeSession.isRecording;
            else if (currentState === SoundQuestState.PASSAGE_MISSION) isRec = passageSession.isRecording;
            else isRec = phraseSession.isRecording;

            if (isRec) { 
                sqRecognition.stop(); 
            } 
            else {
                if (currentState === SoundQuestState.PASSAGE_MISSION) {
                    sqRecognition.continuous = true;
                    sqRecognition.interimResults = true;
                    passageSession.isRecording = true;
                    passageTranscript = "";
                } else {
                    sqRecognition.continuous = false;
                    sqRecognition.interimResults = false;
                    if (currentState === SoundQuestState.VOICE_CHECK) voiceCheckSession.isRecording = true;
                    else if (currentState === SoundQuestState.WORD_PRACTICE) wordPracticeSession.isRecording = true;
                    else phraseSession.isRecording = true;
                }
                renderScreen(); 
                try { sqRecognition.start(); } catch(e) { 
                    if(currentState===SoundQuestState.VOICE_CHECK) voiceCheckSession.isRecording=false; 
                    else if(currentState===SoundQuestState.WORD_PRACTICE) wordPracticeSession.isRecording=false;
                    else if(currentState===SoundQuestState.PASSAGE_MISSION) passageSession.isRecording=false;
                    else phraseSession.isRecording=false; 
                    renderScreen(); 
                }
            }
        }

        function handleVoiceRecognitionResult(alternatives) {
            const topTranscript = alternatives[0] ? normalizeSpeechText(alternatives[0].transcript) : "";
            const c = getCurrentCourse();
            
            if (currentState === SoundQuestState.VOICE_CHECK) {
                voiceCheckSession.isRecording = false; 
                const pair = c.pairs[voiceCheckSession.currentPairIndex];
                const targetWord = normalizeSpeechText(voiceCheckSession.currentTargetIsA ? pair.wordA : pair.wordB); 
                const contrastWord = normalizeSpeechText(voiceCheckSession.currentTargetIsA ? pair.wordB : pair.wordA);
                
                voiceCheckSession.alternativesData = alternatives;
                if (!alternatives || alternatives.length === 0) { voiceCheckSession.resultStatus = 'retry'; } 
                else if (topTranscript.includes(targetWord) || topTranscript === targetWord) { 
                    voiceCheckSession.resultStatus = 'clear'; playGentleSound('correct'); fireSmallConfetti(); 
                } 
                else if (topTranscript === contrastWord) { voiceCheckSession.resultStatus = 'contrast_error'; playGentleSound('incorrect'); } 
                else {
                    let foundInClose = false; 
                    for (let i = 1; i < alternatives.length; i++) { 
                        if (normalizeSpeechText(alternatives[i].transcript).includes(targetWord)) { foundInClose = true; break; } 
                    }
                    voiceCheckSession.resultStatus = foundInClose ? 'close' : 'retry';
                    if(foundInClose) playGentleSound('correct'); else playGentleSound('incorrect');
                }
            } 
            else if (currentState === SoundQuestState.WORD_PRACTICE) {
                wordPracticeSession.isRecording = false; 
                let rawWord = wordPracticeSession.listWords[wordPracticeSession.currentIndex];
                let targetWord = normalizeSpeechText(rawWord.split('/')[0]); 
                
                wordPracticeSession.alternativesData = alternatives;
                if (!alternatives || alternatives.length === 0) { wordPracticeSession.resultStatus = 'retry'; }
                else if (topTranscript.includes(targetWord) || topTranscript === targetWord) { 
                    wordPracticeSession.resultStatus = 'clear'; playGentleSound('correct'); fireSmallConfetti(); 
                }
                else {
                    let foundInClose = false; for (let i = 1; i < alternatives.length; i++) { if (normalizeSpeechText(alternatives[i].transcript).includes(targetWord)) { foundInClose = true; break; } }
                    wordPracticeSession.resultStatus = foundInClose ? 'close' : 'retry';
                    if(foundInClose) playGentleSound('correct'); else playGentleSound('incorrect');
                }
            }
            else if (currentState === SoundQuestState.PHRASE_BRIDGE || currentState === SoundQuestState.SENTENCE_MISSION) {
                phraseSession.isRecording = false;
                phraseSession.alternativesData = alternatives; 
                if (!topTranscript) { phraseSession.resultStatus = 'retry'; }
                else {
                    let matchedCount = 0; phraseSession.data.targetWords.forEach(tw => { if (topTranscript.includes(normalizeSpeechText(tw))) matchedCount++; });
                    phraseSession.matchedWords = matchedCount; phraseSession.resultStatus = (matchedCount === phraseSession.data.targetWords.length) ? 'clear' : 'close';
                    if (phraseSession.resultStatus === 'clear') { playGentleSound('correct'); fireSmallConfetti(); } else playGentleSound('incorrect');
                }
            }
            renderScreen();
        }

        function handlePassageResult(transcript) {
            passageSession.isRecording = false;
            passageSession.alternativesData = [{transcript: transcript.trim() || '???'}];
            
            if (!transcript.trim()) { 
                passageSession.resultStatus = 'retry';
                currentState = SoundQuestState.PASSAGE_MISSION;
                renderScreen();
                return;
            }

            let targetWords = normalizeSpeechText(passageSession.data.text).split(/\s+/);
            let recogWords = normalizeSpeechText(transcript).split(/\s+/);
            
            let matchCount = 0;
            let recogWordsCopy = [...recogWords];
            targetWords.forEach(tw => {
                const idx = recogWordsCopy.indexOf(tw);
                if (idx !== -1) {
                    matchCount++;
                    recogWordsCopy.splice(idx, 1);
                }
            });
            
            let accuracy = Math.round((matchCount / targetWords.length) * 100);
            if (accuracy > 100) accuracy = 100;
            passageSession.accuracy = accuracy;
            
            if (accuracy >= 80) { playGentleSound('correct'); fireSmallConfetti(); } 
            else { playGentleSound('incorrect'); }
            
            currentState = SoundQuestState.PASSAGE_RESULT;
            renderScreen();
        }

            }

                        <h2 class="text-xs font-black tracking-[0.3em] text-${themeColor}-600 mb-6 uppercase">Passage Mission</h2>
                        
                        <div class="mb-10 w-full">
                            <p class="text-stone-400 text-[10px] md:text-xs font-bold mb-4 tracking-widest uppercase border-b-2 border-stone-100 pb-2 inline-block">${passageSession.data.translation}</p>
                            
                            <div class="w-full text-left px-2 md:px-6">
                                <h3 class="text-2xl sm:text-3xl md:text-4xl font-bold text-stone-800 mt-2 serif-font leading-[1.8] md:leading-[2.0] drop-shadow-sm">${displayHtml}</h3>
                                ${kanaHtml}
                            </div>
                        </div>
                        
                        <button onclick="playTextAudio()" class="px-6 py-3 bg-stone-50 hover:bg-stone-100 text-stone-600 font-bold rounded-full transition text-sm md:text-base mb-10 border-2 border-stone-200 flex items-center gap-2 mx-auto shadow-sm hover:shadow-md tracking-widest">🔊 お手本を全編聞く</button>
                        
                        <div class="relative w-28 h-28 md:w-32 md:h-32 mx-auto mb-6">
                            <button onclick="toggleMic()" class="absolute inset-0 w-full h-full rounded-full flex flex-col items-center justify-center text-white transition-all shadow-xl z-10 ${passageSession.isRecording ? `bg-${themeColor}-500 recording-ripple` : `bg-stone-800 border-[6px] border-stone-200 hover:bg-stone-700 hover:border-stone-300`}"><span class="text-5xl md:text-6xl mb-1">${passageSession.isRecording ? '⏹' : '🎤'}</span></button>
                        </div>
                        
                        ${feedbackHtml}
                    </div>
                `;
            }
            else if (currentState === SoundQuestState.PASSAGE_RESULT) {
                const acc = passageSession.accuracy;
                const c = getCurrentCourse();
                const themeColor = c.theme.split('-')[1];
                
                container.innerHTML = `
                    <div class="bg-white rounded-3xl border-4 border-${themeColor}-400 p-8 md:p-14 shadow-xl text-center mx-auto w-full max-w-2xl flex flex-col items-center justify-center min-h-[40vh] md:min-h-[50vh] animate-pop-in">
                        <h2 class="text-xs font-black tracking-[0.3em] text-stone-400 mb-6 uppercase">Passage Reading Result</h2>
                        
                        <div class="text-6xl md:text-8xl font-black mb-2 serif-font text-${themeColor}-500 drop-shadow-sm flex items-end justify-center gap-2">
                            ${acc} <span class="text-3xl md:text-5xl text-stone-300">%</span>
                        </div>
                        <p class="text-stone-500 font-bold text-sm md:text-base mb-8 tracking-widest uppercase">Accuracy</p>
                        
                        ${acc >= 80 ? `<p class="text-emerald-600 font-bold text-lg md:text-xl mb-10">素晴らしい！リエゾンのルールがしっかり定着しています！✨</p>` : `<p class="text-orange-500 font-bold text-lg md:text-xl mb-10">Nice try! 繰り返し練習してさらに精度を上げましょう！💪</p>`}
                        
                        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                            <button onclick="startPassageMission()" class="w-full sm:w-auto px-8 py-4 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-sm md:text-base rounded-full shadow-sm transition tracking-widest">
                                もう一度練習する 🔄
                            </button>
                            <button onclick="showCompletionModal()" class="w-full sm:w-auto px-10 py-4 bg-${themeColor}-600 hover:bg-${themeColor}-500 text-white font-black text-sm md:text-base rounded-full shadow-lg transition transform hover:scale-105 tracking-widest">
                                ミッション完了 ➔
                            </button>
                        </div>
                    </div>`;
            }
            window.scrollTo(0, 0);
        }

        window.addEventListener('DOMContentLoaded', () => { renderScreen(); });
    </script>
</body>
</html>
