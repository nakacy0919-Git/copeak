<script>
(()=>{'use strict';
const el=document.getElementById('content'),unitList=document.getElementById('units');
const dbName='copeak_personal_study_grade2_v1';let state={unit:4,section:'all',category:null,index:0,done:false,choice:-1,tiles:[],chosen:[],optionKey:null,optionOrder:null,slotBags:{},speakingResult:null,rec:null,started:false,finished:false,seen:0};
let progress={},database=null;let persistStatus='loading';
function scoreKey(cat,item){return `u${state.unit}|${cat}|${item.id}`}
function getScore(cat,item){return progress[scoreKey(cat,item)]||{streak:0,attempts:0,correct:0,practice:0,last:null}}
async function openDB(){try{return await new Promise((resolve,reject)=>{const req=indexedDB.open(dbName,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}catch(e){return null}}
async function init(){database=await openDB();try{if(database){const data=await new Promise((resolve,reject)=>{const r=database.transaction('state','readonly').objectStore('state').get('progress');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(data&&typeof data==='object')progress=data;persistStatus='IndexedDB'}else{progress=JSON.parse(localStorage.getItem(dbName))||{};persistStatus='localStorage'}}catch(e){progress={};persistStatus='この端末では保存不可'}render();}
function persist(){if(database){try{database.transaction('state','readwrite').objectStore('state').put(progress,'progress')}catch(e){persistStatus='保存失敗'}}else{try{localStorage.setItem(dbName,JSON.stringify(progress))}catch(e){persistStatus='保存失敗'}}}
function record(cat,item,correct,type='graded'){const key=scoreKey(cat,item);const p={...getScore(cat,item)};p.last=new Date().toISOString();if(type==='practice'){p.practice=(p.practice||0)+1;p.streak=Math.max(p.streak,0)}else{p.attempts=(p.attempts||0)+1;p.correct=(p.correct||0)+(correct?1:0);p.streak=correct?Math.min(2,p.streak+1):0}progress[key]=p;persist();}
const allItems=cat=>state.section!=='all'?(SECTION_PRACTICE[String(state.unit)]?.[state.section]?.[cat]||[]):(!!SECTION_CATALOG[String(state.unit)]?.length?(SECTION_CATALOG[String(state.unit)]||[]).flatMap(sec=>SECTION_PRACTICE[String(state.unit)]?.[sec.id]?.[cat]||[]):(DATASETS[state.unit]?.[cat]||[]));const items=cat=>{const a=allItems(cat);return state.reviewIds && state.category===cat ? a.filter(v=>state.reviewIds.includes(v.id)):a};
function metrics(cat){let a=allItems(cat),earned=0,mastered=0,done=0;for(const it of a){const p=getScore(cat,it);earned+=Math.min(2,p.streak);if(p.streak>=2)mastered++;if(p.attempts>0||p.practice>0)done++}return{count:a.length,earned,pct:a.length?Math.round(earned/(a.length*2)*100):0,mastered,done}}
function overall(){let n=0,e=0,m=0;for(const c of CATEGORY_META){const t=metrics(c.id);n+=t.count;e+=t.earned;m+=t.mastered}return{count:n,pct:n?Math.round(e/(n*2)*100):0,mastered:m}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ring(pct,color,size=64){return `<div class="mini-donut" style="width:${size}px;height:${size}px;background:conic-gradient(${color} 0 ${pct}%,#e9f0f2 ${pct}% 100%)"><strong>${pct}%</strong></div>`}

function startCat(cat,review=false){if(allItems(cat).length===0)return;stopSpeech();state.reviewIds=review?allItems(cat).filter(x=>{const a=getScore(cat,x);return a.attempts>a.correct && a.streak<2}).map(x=>x.id):null;state.category=cat;state.index=0;state.done=false;state.finished=false;state.seen=0;state.choice=-1;state.optionKey=null;state.optionOrder=null;state.slotBags={};state.speakingResult=null;state.tiles=[];state.chosen=[];state.started=false;render()}

function shuffle(arr,seed){let a=arr.slice(),h=[...String(seed)].reduce((n,c)=>n*31+c.charCodeAt(0),137)&2147483647;for(let i=a.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;let j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function randomOrder(a){const result=a.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function mcChoices(item,arr,correct,explain){
 const key=[state.unit,state.section,state.category,state.index,item.id,arr.length].join('|');
 if(state.optionKey!==key){
   const options=arr.map((text,i)=>({text,original:i}));
   const target=options.splice(correct,1)[0];
   const available=state.slotBags[arr.length]||[];
   if(!available.length)state.slotBags[arr.length]=randomOrder(Array.from({length:arr.length},(_,i)=>i));
   const slot=state.slotBags[arr.length].pop();
   const order=randomOrder(options);order.splice(slot,0,target);
   state.optionOrder=order;state.optionKey=key;
 }
 const sorted=state.optionOrder||[];
 return '<div class="choices">'+sorted.map(o=>'<button class="choice" data-option="'+o.original+'" data-is="'+(o.original===correct?'yes':'no')+'">'+esc(o.text)+'</button>').join('')+'</div>'+
 '<div class="answer-note '+(state.done?(state.choice===correct?'good':'bad'):'')+'" id="feedback" '+(!state.done?'hidden':'')+'>'+
 (state.done?(state.choice===correct?'✓ 正解！':'↻ もう一度練習しましょう。')+'　'+esc(explain||''):'')+'</div>';
}

let correctTimer=null, audioContext=null;
function successSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext)audioContext=new AC();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;[659.25,783.99,1046.5].forEach((hz,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,now+i*.09);gain.gain.exponentialRampToValueAtTime(.075,now+i*.09+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.24);osc.connect(gain).connect(audioContext.destination);osc.start(now+i*.09);osc.stop(now+i*.09+.26)})}catch(e){}}

function spellingChoices(it){
 const word=String(it.word||'').toLowerCase();
 const known=new Set(allItems('vocab').map(v=>String(v.word||'').toLowerCase()));
 const result=[word],seen=new Set([word]);
 function add(candidate){
  if(candidate===word||candidate.length<2||seen.has(candidate)||known.has(candidate)||!(/^[a-z]+$/.test(candidate)))return;
  seen.add(candidate);result.push(candidate);
 }
 // Adjacent letter reversal, omitted letter, extra letter and vowel substitution.
 for(let i=0;i<word.length-1;i++){
  if(word[i]!==word[i+1])add(word.slice(0,i)+word[i+1]+word[i]+word.slice(i+2));
 }
 for(let i=1;i<word.length;i++)add(word.slice(0,i)+word.slice(i+1));
 for(let i=1;i<word.length;i++)add(word.slice(0,i)+word[i]+word.slice(i));
 const vowels='aeiou';
 for(let i=0;i<word.length;i++){
  if(vowels.includes(word[i])){
   for(const v of vowels)if(v!==word[i])add(word.slice(0,i)+v+word.slice(i+1));
  }
 }
 for(let i=0;i<word.length;i++){
  const alt=word[i]==='e'?'a':word[i]==='s'?'c':word[i]==='r'?'l':word[i]==='i'?'e':'e';
  add(word.slice(0,i)+alt+word.slice(i+1));
 }
 return result.slice(0,4);
}

}
function speakView(it){return `${prompt('例文を音読しよう',it.en,it.jp)}<div class="qend" style="min-height:80px"><button id="hear-model" class="audio-btn">♫　お手本を聞く</button><button id="speak-record" class="primary">${state.started?'■ 判定する':'● 音読スタート'}</button></div><div class="answer-note ${state.done?'good':''}">${state.speakingResult||'マイク許可が必要です。対応ブラウザでは音声認識結果を原文と照合します。非対応の場合は練習のみ記録します。'}</div><div class="actions">${state.done?'<button id="next" class="primary">次へ →</button>':`<button id="selfpractice" class="outline">音読だけ記録して次へ</button>`}</div>`}
function stopSpeech(){if(state.rec){try{state.rec.abort()}catch(e){}state.rec=null}state.started=false}
function compareSpeech(expected,spoken){const a=expected.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean),b=spoken.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean),n=a.length,m=b.length;let dp=Array.from({length:n+1},(_,i)=>Array.from({length:m+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return Math.max(0,Math.round((1-dp[n][m]/Math.max(1,n,m))*100))}
function wireSpeaking(it){document.getElementById('hear-model').onclick=()=>speakText(it.en,.81);document.getElementById('selfpractice')?.addEventListener('click',()=>{record('speaking',it,false,'practice');nextItem()});const recButton=document.getElementById('speak-record');recButton.onclick=()=>{if(state.done)return;if(state.started){try{state.rec.stop()}catch(e){}return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.speakingResult='音声認識が使えません。音読練習だけ記録して次へ進めます。';renderPractice();return}const rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;state.rec=rec;state.started=true;rec.onresult=e=>{const transcript=e.results?.[0]?.[0]?.transcript||'';const acc=compareSpeech(it.en,transcript);const correct=acc>=85;state.speakingResult=`認識：「${esc(transcript)}」 / 一致度 ${acc}%　${correct?'✓ 合格':'もう一度練習'}`;state.done=true;state.started=false;record('speaking',it,correct);renderPractice()};rec.onerror=e=>{state.started=false;state.speakingResult='音声認識を完了できませんでした（'+esc(e.error||'不明')+'）。お手本を聞いて再挑戦してください。';renderPractice()};rec.onend=()=>{state.started=false;if(document.getElementById('speak-record'))document.getElementById('speak-record').textContent='● 音読スタート'};try{rec.start();recButton.textContent='■ 判定する'}catch(e){state.started=false;state.speakingResult='音声認識を開始できませんでした。';renderPractice()}}}
function toDash(){stopSpeech();state.category=null;state.reviewIds=null;state.finished=false;render()}
function showReviewMenu(){
 const counts=CATEGORY_META.map(c=>({...c,n:allItems(c.id).filter(x=>{const p=getScore(c.id,x);return p.attempts>p.correct&&p.streak<2}).length})).filter(x=>x.n>0);
 if(!counts.length){alert('まだ間違いとして記録された問題はありません。各分野の練習から始めてください。');return}
 const cover=document.createElement('div');cover.style='position:fixed;inset:0;z-index:999;background:rgba(19,43,53,.35);display:grid;place-items:center;padding:15px';
 cover.innerHTML=`<div style="width:min(90vw,400px);background:white;border-radius:20px;padding:17px"><div style="display:flex;justify-content:space-between;align-items:center"><strong>間違えた問題の復習</strong><button id="reviewclose" class="outline">閉じる</button></div><div style="display:grid;gap:8px;margin-top:14px">${counts.map(c=>`<button class="choice" style="min-height:50px;text-align:left" data-review="${c.id}">${esc(c.label)}　<span style="color:#78909a;font-size:11px">${c.n}問の復習</span></button>`).join('')}</div></div>`;
 document.body.appendChild(cover);cover.onclick=e=>{if(e.target===cover)cover.remove()};cover.querySelector('#reviewclose').onclick=()=>cover.remove();cover.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const cat=b.dataset.review;cover.remove();startCat(cat,true)})
}

function showExtraIndex(){document.getElementById('extra-index')?.remove();let lay=document.createElement('div');lay.id='extra-index';lay.style='position:fixed;inset:0;z-index:999;background:#2c213f66;display:grid;place-items:center;padding:15px';lay.innerHTML=`<div style="background:white;border-radius:18px;padding:16px;max-width:540px;width:94%;max-height:80vh;overflow:auto"><div style="display:flex;align-items:center;justify-content:space-between"><b>教科書のそのほかの教材</b><button id="extra-close" class="outline">閉じる</button></div><div style="font-size:11px;color:#74828d;margin:7px 0">目次の索引を確認できます。問題が未収録の教材は学習済み扱いにしません。</div>${EXTRA_INDEX.map(x=>`<div style="border-bottom:1px solid #eee;padding:8px 3px;font-size:12px"><b>${esc(x.kind)}</b>　${esc(x.title)}<span style="float:right;color:#a05e83">p.${x.pageStart}${x.pageEnd>x.pageStart?'–'+x.pageEnd:''}</span></div>`).join('')}</div>`;document.body.append(lay);lay.querySelector('#extra-close').onclick=()=>lay.remove();lay.onclick=e=>{if(e.target===lay)lay.remove()}}
function showUnitMenu(){
let old=document.getElementById('unit-overlay');if(old){old.remove();return}
const cover=document.createElement('div');cover.id='unit-overlay';cover.style='position:fixed;inset:0;z-index:999;background:rgba(19,43,53,.35);display:grid;place-items:center;padding:15px;';
cover.innerHTML=`<div style="width:min(92vw,480px);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:18px;box-shadow:0 18px 60px #1335"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><strong>Unitを選択</strong><button id="closeunit" class="outline">閉じる ✕</button></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${UNIT_META.map(u=>`<button class="choice" data-select-unit="${u.id}" style="min-height:64px;text-align:left"><b>Unit ${u.id}</b><br><span style="font-size:11px;color:#75939a">${esc(u.title)}</span></button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="outline" id="overlay-export">記録を保存 ↓</button><button class="outline" id="overlay-import">記録を復元 ↑</button></div></div>`;
document.body.appendChild(cover);cover.onclick=e=>{if(e.target===cover)cover.remove()};cover.querySelector('#closeunit').onclick=()=>cover.remove();cover.querySelectorAll('[data-select-unit]').forEach(b=>b.onclick=()=>{const n=+b.dataset.selectUnit;cover.remove();selectUnit(n)});cover.querySelector('#overlay-export').onclick=()=>{cover.remove();downloadProgress()};cover.querySelector('#overlay-import').onclick=()=>{cover.remove();document.getElementById('import-file').click()};
}
function downloadProgress(){const data={format:'Copeak Grade 2 Study Backup',version:1,exportedAt:new Date().toISOString(),progress};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='copeak-study-grade2-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importProgress(f){if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!['Copeak Grade 1 Study Backup','Copeak Grade 2 Study Backup'].includes(data.format)||typeof data.progress!=='object'||!data.progress)throw new Error('形式が違います');const cleaned={};for(const [key,score] of Object.entries(data.progress)){if(!/^u(?:10|[0-9])\|(vocab|listening|meaning|grammar|speaking|spelling|ordering|reading)\|[a-z0-9-]+$/i.test(key))continue;if(!score||typeof score!=='object')continue;cleaned[key]={streak:Math.max(0,Math.min(2,Number(score.streak)||0)),attempts:Math.max(0,Number(score.attempts)||0),correct:Math.max(0,Number(score.correct)||0),practice:Math.max(0,Number(score.practice)||0),last:typeof score.last==='string'?score.last:null}}if(confirm('現在の学習記録をバックアップの記録に置き換えますか？')){progress=cleaned;persist();toDash();alert('学習記録を復元しました。')}}catch(e){alert('学習記録の読み込みに失敗しました。')}};reader.readAsText(f)}
document.getElementById('home-top').onclick=toDash;document.getElementById('unit-menu').onclick=showUnitMenu;document.getElementById('export').onclick=downloadProgress;document.getElementById('import').onclick=()=>document.getElementById('import-file').click();document.getElementById('import-file').onchange=e=>importProgress(e.target.files[0]);init();
})();
