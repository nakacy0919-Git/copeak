<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japeak Menu - シチュエーションをえらぶ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
        <style>
    body { 
        font-family: 'Noto Sans JP', sans-serif; 
        background-color: #f4f0e6; 
        background-image: radial-gradient(#d6d3c4 1px, transparent 1px);
        background-size: 20px 20px;
        min-height: 100vh;
    }

    .mincho-font { 
        font-family: 'Noto Serif JP', serif; 
    }

    .wa-border { 
        border: 3px solid #1e3a5f; 
        box-shadow: 4px 4px 0px rgba(30,58,95,1); 
    }

    .life-border { 
        border: 3px solid #047857; 
        box-shadow: 4px 4px 0px rgba(4,120,87,1); 
    }

    .category-btn.active { 
        background-color: #b91c1c; 
        color: white; 
        border-color: #991b1b; 
    }

    .custom-container-scroll {
        max-height: 65vh;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #047857 #f5f5f4;
    }

    .custom-container-scroll::-webkit-scrollbar {
        width: 8px;
    }

    .custom-container-scroll::-webkit-scrollbar-track {
        background: #f5f5f4;
    }

    .custom-container-scroll::-webkit-scrollbar-thumb {
        background: #047857;
        border-radius: 999px;
    }

    #custom-lang-list::-webkit-scrollbar,
    #jp-info-modal-body::-webkit-scrollbar {
        width: 8px;
    }

    #custom-lang-list::-webkit-scrollbar-track,
    #jp-info-modal-body::-webkit-scrollbar-track {
        background: #f5f5f4;
    }

    #custom-lang-list::-webkit-scrollbar-thumb,
    #jp-info-modal-body::-webkit-scrollbar-thumb {
        background: #a8a29e;
        border-radius: 999px;
    }

    #gate-container > button {
        box-shadow: 0 10px 20px rgba(41,37,36,0.08);
    }

    #gate-container > button:hover {
        box-shadow: 0 18px 30px rgba(41,37,36,0.13);
    }

    #japeak-info-modal > div {
        animation: jpModalIn 0.22s ease-out;
    }

    @keyframes jpModalIn {
        from {
            opacity: 0;
            transform: translateY(8px) scale(0.985);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
</style>
</head>
<body class="text-stone-800 pb-12">

    <!-- ナビゲーション -->
    <div class="max-w-[1000px] w-[95%] mx-auto mt-6 md:mt-10 p-6 md:p-8 bg-[#fdfcf8] rounded-sm wa-border flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3 md:gap-4">
            <img src="japeaklog.png" alt="Japeak Logo" class="w-12 h-12 md:w-14 md:h-14 object-cover rounded-full border-2 border-[#1e3a5f] drop-shadow-sm">
            <div class="flex flex-col">
                <h1 class="text-3xl font-black text-[#1e3a5f] mincho-font tracking-widest">Japeak</h1>
                <p class="text-[10px] text-[#b91c1c] font-bold tracking-widest">にほんごのれんしゅうをしましょう</p>
            </div>
        </div>
        <div class="flex items-center gap-6">
            
            <!-- カスタム言語選択ドロップダウン -->
            <div class="relative inline-block text-left w-48 md:w-56 z-50" id="custom-lang-wrapper">
                <div class="text-center text-[10px] text-[#0086d9] font-bold mb-0.5 tracking-widest uppercase">LANGUAGE</div>
                <button type="button" id="custom-lang-btn" class="inline-flex justify-between items-center w-full rounded-sm shadow-sm px-3 py-2 md:py-2.5 bg-[#0086d9] text-sm md:text-base font-bold text-white hover:bg-[#0074bd] transition-colors focus:outline-none">
                    <span id="custom-lang-display" class="flex items-end gap-2">
                        <span>English</span> <span class="text-[10px] font-normal opacity-90 mb-0.5">英語</span>
                    </span>
                    <svg id="custom-lang-chevron" class="ml-2 h-5 w-5 transition-transform duration-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>

                <div id="custom-lang-menu" class="hidden absolute right-0 mt-0 w-full rounded-b-sm shadow-2xl bg-white border border-stone-200 overflow-hidden transform origin-top transition-all duration-200">
                    <ul id="custom-lang-list" class="max-h-64 md:max-h-80 overflow-y-auto py-1 text-stone-800" style="scrollbar-width: thin; scrollbar-color: #a8a29e #f5f5f4;">
                        <!-- スクリプトで自動生成 -->
                    </ul>
                </div>

                <select id="menu-lang-select" class="hidden">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="ko">한국어</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="tl">Filipino</option>
                    <option value="id">Indonesia</option>
                    <option value="th">ภาษาไทย</option>
                    <option value="my">မြန်မာဘာသာ</option>
                    <option value="km">ខ្មែរ</option>
                    <option value="ne">नेपाली</option>
                    <option value="mn">Монгол хэл</option>
                    <option value="si">සිංහල</option>
                    <option value="bn">বাংলা ভাষা</option>
                    <option value="pt">Português</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="ru">Русский</option>
                    <option value="uk">Українська</option>
                </select>
            </div>

            <button id="btn-top-back" onclick="window.location.href='japeak-top.html'" class="bg-[#1e3a5f] hover:bg-[#172a45] text-white text-[10px] md:text-xs font-bold px-4 py-2 rounded-sm transition shadow-md self-end mb-0.5 whitespace-nowrap">
                トップへ戻る
            </button>
        </div>
    </div>

    <!-- ==============================
         🚪 ゲート画面 (スタート初期画面)
    ============================== -->
    <div id="gate-container" class="max-w-[800px] w-[95%] mx-auto mt-12 mb-12 flex flex-col md:flex-row gap-8 transition-all duration-500">
        
        <!-- 学校編ボタン -->
        <button onclick="enterWorkspace('school')" class="group relative flex-1 bg-white rounded-2xl shadow-xl border-2 border-stone-200 hover:border-[#1e3a5f] overflow-hidden transition-all duration-300 hover:shadow-2xl transform hover:-translate-y-2 outline-none">
            <div class="absolute top-0 left-0 w-full h-4 bg-[#1e3a5f] transition-all group-hover:h-6"></div>
            <div class="p-10 md:p-14 flex flex-col items-center justify-center gap-6 mt-2">
                <div class="w-24 h-24 md:w-28 md:h-28 bg-stone-50 rounded-full flex items-center justify-center border-4 border-stone-100 group-hover:bg-[#1e3a5f]/5 transition-colors">
                    <span class="text-6xl md:text-7xl group-hover:scale-110 transition-transform duration-300">🏫</span>
                </div>
                <div class="flex flex-col items-center">
                    <h2 id="btn-text-school" class="text-2xl md:text-3xl font-black text-[#1e3a5f] tracking-widest text-center">学校編</h2>
                    <p id="sub-text-school" class="text-stone-400 font-bold text-xs md:text-sm tracking-widest mt-2 uppercase">School</p>
                </div>
            </div>
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 text-[#1e3a5f] font-black text-xl">➔ ENTER</div>
        </button>

        <!-- 生活編ボタン -->
        <button onclick="enterWorkspace('life')" class="group relative flex-1 bg-white rounded-2xl shadow-xl border-2 border-stone-200 hover:border-[#047857] overflow-hidden transition-all duration-300 hover:shadow-2xl transform hover:-translate-y-2 outline-none">
            <div class="absolute top-0 left-0 w-full h-4 bg-[#047857] transition-all group-hover:h-6"></div>
            <div class="p-10 md:p-14 flex flex-col items-center justify-center gap-6 mt-2">
                <div class="w-24 h-24 md:w-28 md:h-28 bg-stone-50 rounded-full flex items-center justify-center border-4 border-stone-100 group-hover:bg-[#047857]/5 transition-colors">
                    <span class="text-6xl md:text-7xl group-hover:scale-110 transition-transform duration-300">🏘️</span>
                </div>
                <div class="flex flex-col items-center">
                    <h2 id="btn-text-life" class="text-2xl md:text-3xl font-black text-[#047857] tracking-widest text-center">生活編</h2>
                    <p id="sub-text-life" class="text-stone-400 font-bold text-xs md:text-sm tracking-widest mt-2 uppercase">Daily Life</p>
                </div>
            </div>
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 text-[#047857] font-black text-xl">➔ ENTER</div>
        </button>
    </div>

    <!-- ==============================
         🛠️ ワークスペース (ダッシュボード)
    ============================== -->
    <div id="workspace-container" class="max-w-[1000px] w-[95%] mx-auto mt-6 flex flex-col gap-6 hidden opacity-0 transition-opacity duration-500">
        
        <button onclick="backToGate()" id="btn-back-to-course" class="self-start text-stone-500 hover:text-stone-800 font-bold text-sm md:text-base flex items-center gap-2 transition-colors border-b-2 border-transparent hover:border-stone-400 pb-1">
            ◀ コース選択にもどる
        </button>

        <!-- 🏫 学校編ダッシュボード -->
        <div id="area-school" class="hidden flex-col gap-6">
            <div class="bg-white p-6 rounded-sm wa-border mb-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 text-9xl opacity-5 pointer-events-none transform translate-x-4 -translate-y-4">🏫</div>
                <h2 class="text-[#1e3a5f] font-bold text-lg mb-4 flex items-center gap-2 relative z-10">
                    <span class="text-2xl">🏫</span> <span id="label-category">どんな 場面（シチュエーション）ですか？</span>
                </h2>
                <div id="category-container" class="flex flex-wrap gap-3 relative z-10">
                    <!-- 既存の学校用カテゴリボタンがjs/japeak-menu.js経由で自動配置されます -->
                </div>
            </div>
        </div>

        <!-- 🏘️ 生活編ダッシュボード -->
        <div id="area-life" class="hidden flex-col gap-6">
            <div class="bg-white p-6 md:p-8 rounded-sm life-border mb-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 text-9xl opacity-5 pointer-events-none transform translate-x-4 -translate-y-4">🏘️</div>
                <h2 class="text-[#047857] font-bold text-xl md:text-2xl mb-8 flex items-center gap-2 border-b-2 border-[#047857]/20 pb-4 relative z-10">
                    <span class="text-3xl">🏘️</span> <span id="label-life-title" class="tracking-wide">生活でつかう にほんご</span>
                </h2>

                <div id="life-categories-box" class="grid grid-cols-1 md:grid-cols-2 gap-10 relative z-10 custom-container-scroll pr-2">
                    <!-- JavaScriptが自動構築 -->
                </div>
            </div>
        </div>

        <!-- 共通フレーズ一覧エリア -->
        <div class="bg-white p-6 rounded-sm border-2 border-stone-300 shadow-sm min-h-[300px]">
            <h2 class="text-stone-700 font-bold text-lg mb-4 flex items-center gap-2 border-b border-stone-200 pb-2">
                <span class="text-2xl">📝</span> <span id="label-phrase">れんしゅうする フレーズ</span>
            </h2>
            <div id="phrase-list-container" class="flex flex-col gap-3">
                <div id="label-select-prompt" class="text-stone-400 text-center py-10 font-bold">シチュエーションを えらんでください</div>
            </div>
        </div>
    </div>



    <!-- データの読み込み -->
    <script src="data/japeak-lessons.js"></script>
    <script src="data/japeak-conversation.js"></script>
    <script src="data/japeak-class.js"></script>
    <script src="data/japeak-health.js"></script>
    <script src="data/japeak-lunch.js"></script>
    <script src="data/japeak-break.js"></script>
    <script src="data/japeak-clubs.js"></script>
    <script src="data/japeak-teachers.js"></script>
    <script src="data/japeak-commuting.js"></script>
    <script src="data/japeak-troubles.js"></script>
    <script src="data/japeak-events.js"></script>
    <script src="data/japeak-office.js"></script>
    <script src="data/japeak-paragraphs.js"></script>
    <script src="data/japeak-a1-s1.js"></script>
    <script src="data/japeak-convenient-shopping.js"></script>
    <script src="data/japeak-convenient-ordering.js"></script>
    <script src="data/japeak-convenient-neighbor.js"></script>
    <script src="data/japeak-convenient-visit-home.js"></script>
    <script src="data/japeak-convenient-question.js"></script>
    <script src="data/japeak-a1-buy-things.js"></script>
    <script src="data/japeak-a1-ask-place-price.js"></script>
    <script src="data/japeak-a1-want-to-buy.js"></script>
    <script src="data/japeak-a1-tell-preferences.js"></script>
    <script src="data/japeak-a1-restaurant.js"></script>
    <script src="data/japeak-a1-delivery.js"></script>
    <script src="data/japeak-a1-train.js"></script>
    <script src="data/japeak-a1-ask-directions.js"></script>
    <script src="data/japeak-a1-bank.js"></script>
    <script src="data/japeak-a1-resident-manners.js"></script>
    <script src="data/japeak-a1-workplace-machines.js"></script>


<!-- ==========================================
     Japeak Premium Compact Footer
     利用規約 / プライバシー / 開発者 / 音声トラブル
     全20言語切り替え対応・Copeak画像使用版
========================================== -->
<div id="japeak-info-footer" class="max-w-[760px] w-[90%] mx-auto mt-10 mb-8">
    <div class="bg-[#fdfcf8]/95 border-2 border-[#1e3a5f] shadow-[4px_4px_0px_rgba(30,58,95,1)] rounded-sm px-4 py-3">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
                <div id="jp-info-footer-badge" class="text-[9px] font-black tracking-[0.22em] text-[#0086d9] uppercase">Japeak Support Center</div>
                <div id="jp-info-footer-title" class="text-sm md:text-base font-black text-[#1e3a5f] mincho-font tracking-wide">安心して日本語を練習するために</div>
            </div>
            <div class="flex flex-wrap justify-center md:justify-end gap-x-4 gap-y-2 text-[11px] md:text-xs font-black text-stone-600">
                <button type="button" onclick="openJapeakInfoModal('trouble')" class="hover:text-red-600 transition flex items-center gap-1"><span>🆘</span><span data-jpinfo="navTrouble">音声トラブル</span></button>
                <button type="button" onclick="openJapeakInfoModal('terms')" class="hover:text-[#1e3a5f] transition flex items-center gap-1"><span>📜</span><span data-jpinfo="navTerms">利用規約</span></button>
                <button type="button" onclick="openJapeakInfoModal('privacy')" class="hover:text-[#1e3a5f] transition flex items-center gap-1"><span>🛡️</span><span data-jpinfo="navPrivacy">プライバシー</span></button>
                <button type="button" onclick="openJapeakInfoModal('developer')" class="hover:text-emerald-700 transition flex items-center gap-1"><span>👨‍🏫</span><span data-jpinfo="navDeveloper">開発者</span></button>
                <a href="index.html" class="hover:text-[#1e3a5f] transition flex items-center gap-1"><span>🎧</span><span data-jpinfo="navCopeak">Copeak</span></a>
            </div>
        </div>
        <div class="mt-3 pt-3 border-t border-stone-200 flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <p id="jp-info-footer-subtitle" class="text-[10px] md:text-[11px] text-stone-500 font-bold leading-relaxed">利用規約、プライバシー、音声認識トラブル対応を確認できます。</p>
            <div class="text-[10px] text-stone-400 font-bold tracking-wider whitespace-nowrap">© 2026 Kohei Nakashima</div>
        </div>
    </div>
</div>

<div id="japeak-info-modal" class="hidden fixed inset-0 z-[9999] bg-black/75 backdrop-blur-md items-center justify-center p-4">
    <div class="bg-[#fdfcf8] w-full max-w-5xl h-[88vh] rounded-2xl shadow-2xl border-4 border-[#1e3a5f] relative overflow-hidden flex flex-col">
        <button type="button" onclick="closeJapeakInfoModal()" class="absolute top-3 right-4 md:top-5 md:right-6 z-50 text-4xl md:text-5xl font-black text-stone-400 hover:text-red-500 transition">&times;</button>
        <div class="shrink-0 bg-[#1e3a5f] text-white px-5 md:px-8 py-5 md:py-6 relative overflow-hidden">
            <div class="absolute -right-8 -top-8 text-white/10 text-9xl pointer-events-none">🗻</div>
            <div class="flex items-center gap-3 md:gap-4 pr-10">
                <div id="jp-info-modal-icon" class="w-12 h-12 md:w-14 md:h-14 bg-white/15 rounded-xl flex items-center justify-center text-3xl shadow-inner">🆘</div>
                <div>
                    <div id="jp-info-modal-kicker" class="text-[10px] md:text-xs font-black tracking-[0.25em] text-blue-200 uppercase mb-1">Japeak Guide</div>
                    <h2 id="jp-info-modal-title" class="text-xl md:text-3xl font-black mincho-font tracking-wide">Title</h2>
                    <p id="jp-info-modal-subtitle" class="text-xs md:text-sm text-stone-200 font-bold mt-1 leading-relaxed">Subtitle</p>
                </div>
            </div>
        </div>
        <div id="jp-info-modal-body" class="flex-1 overflow-y-auto p-4 md:p-6 bg-[#f4f0e6]"></div>
        <div class="shrink-0 bg-white border-t-2 border-stone-200 px-4 md:px-6 py-3 flex items-center justify-between">
            <button id="jp-info-prev-btn" type="button" onclick="moveJapeakTroubleSlide(-1)" class="hidden bg-stone-200 hover:bg-stone-300 text-stone-700 px-5 py-2.5 rounded-full font-black text-xs md:text-sm transition">◀ Back</button>
            <div id="jp-info-dots" class="hidden flex items-center gap-2"></div>
            <button id="jp-info-next-btn" type="button" onclick="moveJapeakTroubleSlide(1)" class="hidden bg-[#0086d9] hover:bg-[#0074bd] text-white px-5 py-2.5 rounded-full font-black text-xs md:text-sm transition shadow-md">Next ▶</button>
            <button id="jp-info-close-btn" type="button" onclick="closeJapeakInfoModal()" class="ml-auto bg-[#1e3a5f] hover:bg-[#172a45] text-white px-6 py-2.5 rounded-sm font-black text-xs md:text-sm transition shadow-md">Close</button>
        </div>
    </div>
</div>


<script src="js/japeak-menu-data.js"></script>
<script src="js/japeak-menu-main.js"></script>



</body>
</html>
