        function enterWorkspace(mode) {
            gateContainer.style.display = 'none';
            workspaceContainer.classList.remove('hidden');
            setTimeout(() => { workspaceContainer.classList.remove('opacity-0'); }, 50);

            if (mode === 'school') {
                areaSchool.classList.remove('hidden'); areaSchool.classList.add('flex');
                areaLife.classList.remove('flex'); areaLife.classList.add('hidden');
            } else {
                areaSchool.classList.remove('flex'); areaSchool.classList.add('hidden');
                areaLife.classList.remove('hidden'); areaLife.classList.add('flex');
            }
        }

        function backToGate() {
            workspaceContainer.classList.add('opacity-0');
            setTimeout(() => {
                workspaceContainer.classList.add('hidden');
                gateContainer.style.display = 'flex';
            }, 300);
        }

        function renderLifeDashboard(langCode) {
            const container = document.getElementById('life-categories-box');
            container.innerHTML = "";

            lifeMasterData.forEach(cat => {
                const block = document.createElement('div');
                block.className = "flex flex-col gap-3";

                const categoryTitleText = cat.titles[langCode] || cat.titles['en'];
                
                block.innerHTML = `
                    <h3 class="font-bold text-stone-700 text-sm md:text-base mb-2 flex items-center gap-2 bg-stone-100 p-2 rounded-sm">
                        ${categoryTitleText}
                    </h3>
                    <div class="flex flex-col gap-2" id="box-${cat.labelId}"></div>
                `;
                container.appendChild(block);

                const listInner = document.getElementById(`box-${cat.labelId}`);
                
                cat.scenes.forEach(scene => {
                    const btn = document.createElement('button');
                    if (scene.isReady) {
                        btn.className = "w-full text-left px-4 py-3 rounded-sm border border-emerald-600 bg-emerald-50 text-emerald-900 font-bold hover:bg-emerald-100 transition-all flex justify-between items-center shadow-[0_2px_0_rgba(4,120,87,1)] active:translate-y-0.5 active:shadow-none text-xs md:text-sm";
                        btn.innerHTML = `<span>${scene.name}</span><span class="text-xs text-emerald-600 font-black">▶</span>`;
                        btn.onclick = () => {
                            if(typeof window.loadJapeakCategory === 'function' && scene.catKey) {
                                window.loadJapeakCategory(scene.catKey);
                            } else {
                                alert(`「${scene.name}」の練習画面へ進みます！`);
                            }
                        };
                    } else {
                        btn.disabled = true;
                        btn.className = "w-full text-left px-4 py-3 rounded-sm border border-stone-200 bg-stone-50 text-stone-400 font-medium grayscale cursor-not-allowed flex justify-between items-center shadow-sm text-xs md:text-sm";
                        const comingSoonText = (langCode === 'ja') ? '準備中' : 'Soon';
                        btn.innerHTML = `<span>${scene.name}</span><span class="text-[9px] bg-stone-300 text-white px-1.5 py-0.5 rounded-sm font-bold tracking-wider">${comingSoonText}</span>`;
                    }
                    listInner.appendChild(btn);
                });
            });
        }

        function updateUiLanguage(langCode) {
            const data = uiDict[langCode] || uiDict['en'];
            
            document.getElementById('btn-text-school').innerText = data.school;
            document.getElementById('btn-text-life').innerText = data.life;
            document.getElementById('btn-back-to-course').innerText = data.back;
            document.getElementById('label-life-title').innerText = data.lifeTitle;
            
            const promptBox = document.getElementById('label-select-prompt');
            if(promptBox) promptBox.innerText = data.prompt;

            renderLifeDashboard(langCode);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const langData = [
                { code: 'ja', native: '日本語', jp: 'にほんご' },
                { code: 'en', native: 'English', jp: '英語' },
                { code: 'zh-CN', native: '简体中文', jp: '中国語（簡体字）' },
                { code: 'zh-TW', native: '繁體中文', jp: '中国語（繁体字）' },
                { code: 'ko', native: '한국어', jp: '韓国語' },
                { code: 'vi', native: 'Tiếng Việt', jp: 'ベトナム語' },
                { code: 'tl', native: 'Filipino', jp: 'フィリピノ語' },
                { code: 'id', native: 'Indonesia', jp: 'インドネシア語' },
                { code: 'th', native: 'ภาษาไทย', jp: 'タイ語' },
                { code: 'my', native: 'မြန်မာဘာသာ', jp: 'ミャンマー語' },
                { code: 'km', native: 'ខ្មែរ', jp: 'クメール語' },
                { code: 'ne', native: 'नेपाली', jp: 'ネパール語' },
                { code: 'mn', native: 'Монгол хэл', jp: 'モンгол語' },
                { code: 'si', native: 'සිංහල', jp: 'シンハラ語' },
                { code: 'bn', native: 'বাংলা ভাষা', jp: 'ベンガル語' },
                { code: 'pt', native: 'Português', jp: 'ポルトガル語' },
                { code: 'es', native: 'Español', jp: 'スペイン語' },
                { code: 'fr', native: 'Français', jp: 'フランス語' },
                { code: 'ru', native: 'Русский', jp: 'ロシア語' },
                { code: 'uk', native: 'Українська', jp: 'ウクライナ語' }
            ];

            const btn = document.getElementById('custom-lang-btn');
            const menu = document.getElementById('custom-lang-menu');
            const list = document.getElementById('custom-lang-list');
            const display = document.getElementById('custom-lang-display');
            const chevron = document.getElementById('custom-lang-chevron');
            const hiddenSelect = document.getElementById('menu-lang-select');

            langData.forEach(lang => {
                const li = document.createElement('li');
                li.className = "px-4 py-3 hover:bg-[#eef8ff] cursor-pointer border-b border-stone-100 last:border-0 transition-colors flex items-baseline gap-2 text-left";
                li.innerHTML = `<span class="text-base font-medium">${lang.native}</span> <span class="text-[10px] text-stone-500 font-bold mb-0.5">${lang.jp}</span>`;
                
                li.addEventListener('click', () => {
                    display.innerHTML = `<span>${lang.native}</span> <span class="text-[10px] font-normal opacity-90 mb-0.5">${lang.jp}</span>`;
                    hiddenSelect.value = lang.code;
                    hiddenSelect.dispatchEvent(new Event('change'));
                    
                    updateUiLanguage(lang.code);
                    closeMenu();
                });
                list.appendChild(li);
            });

            setTimeout(() => {
                const currentCode = hiddenSelect.value || 'en';
                const currentLang = langData.find(l => l.code === currentCode) || langData[0];
                display.innerHTML = `<span>${currentLang.native}</span> <span class="text-[10px] font-normal opacity-90 mb-0.5">${currentLang.jp}</span>`;
                updateUiLanguage(currentCode);
            }, 100);

            function toggleMenu() {
                if (menu.classList.contains('hidden')) {
                    menu.classList.remove('hidden'); chevron.classList.add('rotate-180');
                } else { closeMenu(); }
            }
            function closeMenu() { menu.classList.add('hidden'); chevron.classList.remove('rotate-180'); }

            btn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
            document.addEventListener('click', (e) => { if (!menu.contains(e.target) && !btn.contains(e.target)) closeMenu(); });
        });
    </script>
