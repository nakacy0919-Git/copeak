<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japeak Menu - シチュエーションをえらぶ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: #f4f0e6; 
            background-image: radial-gradient(#d6d3c4 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
        }
        .mincho-font { font-family: 'Noto Serif JP', serif; }
        .wa-border { border: 3px solid #1e3a5f; box-shadow: 4px 4px 0px rgba(30,58,95,1); }
        .category-btn.active { background-color: #b91c1c; color: white; border-color: #991b1b; }

        /* 🌟 オープニングアニメーション用 CSS */
        #japeak-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            /* Japeakカラーのネイビー〜紅色グラデーション */
            background: linear-gradient(135deg, #0f1d2f 0%, #1e3a5f 60%, #7f1d1d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        #japeak-splash.hidden-splash {
            opacity: 0;
            visibility: hidden;
        }
        .splash-item {
            opacity: 0;
            animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(30px) scale(0.9); opacity: 0; filter: blur(5px); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }
    </style>
</head>
<body class="text-stone-800 pb-12">

    <!-- 🌟 オープニング・スプラッシュ画面 -->
    <div id="japeak-splash">
        <img src="japeaklog.png" alt="Japeak Logo" class="splash-item w-32 md:w-48 h-auto object-contain drop-shadow-2xl">
        <h1 class="splash-item text-white mt-6 text-4xl md:text-5xl font-black mincho-font tracking-[0.2em] drop-shadow-lg" style="animation-delay: 0.2s;">Japeak</h1>
        <p class="splash-item text-stone-300 mt-3 text-xs md:text-sm font-bold tracking-[0.3em] uppercase drop-shadow-md" style="animation-delay: 0.4s;">にほんご スピーキング れんしゅう</p>
    </div>

    <!-- ナビゲーション -->
    <div class="max-w-[1000px] w-[95%] mx-auto mt-6 md:mt-10 p-6 md:p-8 bg-[#fdfcf8] rounded-sm wa-border flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3 md:gap-4">
            <img src="japeaklog.png" alt="Japeak Logo" class="w-12 h-12 md:w-14 md:h-14 object-contain drop-shadow-sm">
            <div class="flex flex-col">
                <h1 class="text-3xl font-black text-[#1e3a5f] mincho-font tracking-widest">Japeak</h1>
                <p class="text-[10px] text-[#b91c1c] font-bold tracking-widest">にほんごのれんしゅうをしましょう</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <select id="menu-lang-select" class="text-xs font-bold bg-[#f4f0e6] border-2 border-[#1e3a5f] text-[#1e3a5f] rounded-sm px-3 py-2 outline-none cursor-pointer">
                    <option value="en">English</option>
                    <option value="pt">Português</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="tl">Tagalog</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="es">Español</option>
                    <option value="ne">नेपाली</option>
                    <option value="id">Bahasa Indonesia</option>
                </select>
            </div>
            <button onclick="window.location.href='index.html'" class="bg-[#1e3a5f] hover:bg-[#172a45] text-white text-[10px] md:text-xs font-bold px-4 py-2 rounded-sm transition shadow-md">
                Copeakへ戻る
            </button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-[1000px] w-[95%] mx-auto mt-6 flex flex-col gap-6">
        
        <!-- 場面（カテゴリ）選択エリア -->
        <div class="bg-white p-6 rounded-sm wa-border">
            <h2 class="text-[#1e3a5f] font-bold text-lg mb-4 flex items-center gap-2">
                <span class="text-2xl">🏫</span> <span id="label-category">どんな 場面（シチュエーション）ですか？</span>
            </h2>
            <div id="category-container" class="flex flex-wrap gap-3">
                <!-- JSでカテゴリボタンが生成されます -->
            </div>
        </div>

        <!-- フレーズ一覧エリア -->
        <div class="bg-white p-6 rounded-sm wa-border min-h-[300px]">
            <h2 class="text-[#1e3a5f] font-bold text-lg mb-4 flex items-center gap-2 border-b border-stone-200 pb-2">
                <span class="text-2xl">📝</span> <span id="label-phrase">れんしゅうする フレーズ</span>
            </h2>
            <div id="phrase-list-container" class="flex flex-col gap-3">
                <div class="text-stone-400 text-center py-10 font-bold">シチュエーションを えらんでください</div>
            </div>
        </div>

    </div>

    <!-- データの読み込み -->
    <script src="data/japeak-lessons.js"></script>
    <script src="data/japeak-conversation.js"></script>
    <script src="data/japeak-class.js"></script>
    <script src="data/japeak-health.js"></script>
    <script src="data/japeak-lunch.js"></script>
    <script src="data/japeak-break.js"></script>
    <script src="data/japeak-clubs.js"></script>
    <script src="data/japeak-teachers.js"></script>
    <script src="data/japeak-commuting.js"></script>
    <script src="data/japeak-troubles.js"></script>
    <script src="data/japeak-events.js"></script>
    <script src="data/japeak-office.js"></script>
    
    <script src="js/japeak-menu.js"></script>

    <!-- 🌟 スプラッシュ画面を消すロジック -->
    <script>
        window.addEventListener('load', () => {
            const splash = document.getElementById('japeak-splash');
            if (splash) {
                // アニメーションをしっかり見せるために1.5秒後にフェードアウトを開始
                setTimeout(() => {
                    splash.classList.add('hidden-splash');
                }, 1500);
            }
        });
    </script>
</body>
</html>
