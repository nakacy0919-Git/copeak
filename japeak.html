<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japeak - にほんご スピーキングれんしゅう</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: #f4f0e6; 
            background-image: radial-gradient(#d6d3c4 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
        }
        .mincho-font { font-family: 'Noto Serif JP', serif; }
        .wa-border { border: 3px solid #1e3a5f; box-shadow: 4px 4px 0px rgba(30,58,95,1); }
        .wa-border-sm { border: 2px solid #1e3a5f; }
        ruby { ruby-align: center; }
        rt { font-size: 0.5em; color: #4b5563; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; }
    </style>
</head>
<body class="text-stone-800 pb-12">

    <div class="max-w-[1400px] w-[95%] mx-auto mt-6 md:mt-10 p-6 md:p-8 bg-[#fdfcf8] rounded-sm wa-border flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3 md:gap-4">
            <img src="japeaklog.png" alt="Japeak Logo" class="w-12 h-12 md:w-14 md:h-14 object-contain drop-shadow-sm">
            <div class="flex flex-col">
                <h1 class="text-3xl md:text-4xl font-black text-[#1e3a5f] mincho-font tracking-widest">Japeak</h1>
                <p class="text-[10px] md:text-xs text-[#b91c1c] font-bold tracking-widest">にほんご スピーキング れんしゅう</p>
            </div>
        </div>
        
        <div class="flex items-end gap-2 flex-wrap justify-center md:justify-end">
            
            <div class="relative inline-block text-left w-48 md:w-56 z-50" id="custom-lang-wrapper">
                <div class="text-center text-[10px] text-[#0086d9] font-bold mb-1 tracking-widest uppercase">LANGUAGE</div>
                
                <button type="button" id="custom-lang-btn" class="h-10 md:h-11 inline-flex justify-between items-center w-full rounded-sm shadow-sm px-3 bg-[#0086d9] text-sm md:text-base font-bold text-white hover:bg-[#0074bd] transition-colors focus:outline-none">
                    <span id="custom-lang-display" class="flex items-center gap-2">
                        <span>English</span> <span class="text-[10px] font-normal opacity-90 mt-1">英語</span>
                    </span>
                    <svg id="custom-lang-chevron" class="ml-2 h-5 w-5 transition-transform duration-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>

                <div id="custom-lang-menu" class="hidden absolute right-0 mt-0 w-full rounded-b-sm shadow-2xl bg-white border border-stone-200 overflow-hidden transform origin-top transition-all duration-200">
                    <ul id="custom-lang-list" class="max-h-64 md:max-h-80 overflow-y-auto py-1 text-stone-800" style="scrollbar-width: thin; scrollbar-color: #a8a29e #f5f5f4;">
                        </ul>
                </div>

                <select id="lang-select" class="hidden">
                    <option value="en">English</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="ko">한국어</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="tl">Filipino</option>
                    <option value="id">Indonesia</option>
                    <option value="th">ภาษาไทย</option>
                    <option value="my">မြန်မာဘာသာ</option>
                    <option value="km">ខ្មែរ</option>
                    <option value="ne">नेपाली</option>
                    <option value="mn">Монгол хэл</option>
                    <option value="si">සිංහල</option>
                    <option value="bn">বাংলা ভাষা</option>
                    <option value="pt">Português</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="ru">Русский</option>
                    <option value="uk">Українська</option>
                </select>
            </div>

            <button id="btn-swap-lang" onclick="toggleLanguageSwap()" class="h-10 md:h-11 bg-[#eab308] hover:bg-[#ca8a04] text-white text-[10px] md:text-xs font-bold px-3 md:px-4 rounded-sm shadow-md transition flex items-center justify-center gap-1" title="日本語と外国語を入れ替える">
                🔄 <span class="hidden md:inline">反転</span>
            </button>
            
            <button onclick="window.location.href='japeak-menu.html'" class="h-10 md:h-11 bg-[#b91c1c] hover:bg-[#991b1b] text-white text-[10px] md:text-xs font-bold px-3 md:px-4 rounded-sm transition shadow-md flex items-center justify-center whitespace-nowrap">
                ◀ メニュー
            </button>

            <button onclick="window.location.href='index.html'" class="h-10 md:h-11 bg-[#1e3a5f] hover:bg-[#172a45] text-white text-[10px] md:text-xs font-bold px-3 md:px-4 rounded-sm transition shadow-md flex items-center justify-center whitespace-nowrap">
                Copeakへ
            </button>

        </div>
    </div>

    <div id="layout-container" class="max-w-[1400px] w-[95%] mx-auto mt-6 flex flex-col lg:flex-row gap-6 transition-all duration-500">
        
        <div id="main-pane" class="w-full lg:w-[65%] flex flex-col bg-[#fdfcf8] rounded-sm wa-border overflow-hidden transition-all duration-500">
            
            <div class="bg-[#1e3a5f] p-4 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <button id="btn-prev" class="text-white hover:text-stone-300 text-xl font-bold px-2">◀</button>
                    <h2 id="lesson-title" class="text-white font-bold text-lg mincho-font flex items-center gap-2">
                        <span>🗣️</span> タイトル
                    </h2>
                    <button id="btn-next" class="text-white hover:text-stone-300 text-xl font-bold px-2">▶</button>
                </div>
            </div>

            <div class="p-8 md:p-12 flex-1 flex flex-col justify-center min-h-[250px] relative items-center">
                
                <div class="flex items-center gap-4 mb-8">
                    <button id="btn-play-audio" class="flex items-center justify-center gap-2 bg-gradient-to-r from-rose-400 to-red-500 hover:from-rose-500 hover:to-red-600 text-white px-5 py-2.5 rounded-full shadow-lg shadow-red-500/30 transition-all transform hover:scale-105 active:scale-95" title="お手本を聞く">
                        <span class="text-xl drop-shadow-md">🔈</span>
                        <span class="text-sm font-bold tracking-widest drop-shadow-md">お手本をきく</span>
                    </button>
                    
                    <button id="btn-play-slow" class="flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white px-5 py-2.5 rounded-full shadow-lg shadow-teal-500/30 transition-all transform hover:scale-105 active:scale-95" title="ゆっくり聞く">
                        <span class="text-xl drop-shadow-md">🐢</span>
                        <span class="text-sm font-bold tracking-widest drop-shadow-md">ゆっくり</span>
                    </button>
                </div>

                <div id="sentence-container" class="flex flex-col gap-6 md:gap-8 mx-auto w-fit transition-all duration-300">
                    </div>

            </div>

            <div class="p-6 bg-stone-100 border-t border-stone-200">
                <div class="text-[11px] text-stone-500 font-bold tracking-widest mb-2">あなたの声 (Your Voice)</div>
                <div id="voice-output" class="text-xl md:text-2xl text-stone-400 font-medium mincho-font text-left">
                    ※「話す」ボタンを押してください
                </div>
            </div>

            <div class="p-6 bg-[#f4f0e6] border-t-2 border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-6">
                <div class="flex flex-col items-center bg-white px-6 py-3 rounded-sm wa-border-sm shrink-0 min-w-[120px]">
                    <span class="text-[11px] text-[#1e3a5f] font-bold tracking-widest">正確さ (Accuracy)</span>
                    <span id="acc-output" class="text-4xl font-black text-[#1e3a5f] mincho-font mt-1">0%</span>
                </div>
                <button id="mic-btn" class="flex-1 w-full flex items-center justify-center gap-3 py-4 bg-[#b91c1c] hover:bg-[#991b1b] text-white rounded-sm font-black text-xl shadow-md border-b-4 border-[#7f1d1d] active:border-b-0 active:translate-y-1 transition-all tracking-widest">
                    <span>🎙</span> 話す (Start Speaking)
                </button>
            </div>
        </div>

        <div id="side-pane" class="w-full lg:w-[35%] flex flex-col gap-6 transition-all duration-500">
            
            <div class="bg-white rounded-sm wa-border-sm p-6 shadow-sm relative overflow-hidden flex-1">
                <div class="absolute top-0 left-0 w-1 h-full bg-[#eab308]"></div>
                <h3 class="text-[#854d0e] font-bold text-sm flex items-center gap-2 mb-3 tracking-wide">
                    <span class="text-xl">💡</span> いつ使うの？ (Context)
                </h3>
                <div class="p-4 bg-stone-50 border border-stone-200 rounded-sm h-[calc(100%-2rem)] overflow-y-auto">
                    <p id="context-text" class="text-sm text-stone-600 font-medium leading-relaxed"></p>
                </div>
            </div>

            <div class="bg-white rounded-sm wa-border-sm p-6 shadow-sm relative overflow-hidden flex-1">
                <div class="absolute top-0 left-0 w-1 h-full bg-[#1e3a5f]"></div>
                <h3 class="text-[#1e3a5f] font-bold text-sm flex items-center gap-2 mb-3 tracking-wide">
                    <span class="text-xl">🌐</span> どんな意味？ (Translation)
                </h3>
                <div class="p-4 bg-stone-50 border border-stone-200 rounded-sm h-[calc(100%-2rem)] flex items-center overflow-y-auto">
                    <p id="translation-text" class="text-[17px] text-stone-800 font-bold mincho-font leading-relaxed"></p>
                </div>
            </div>

        </div>
    </div>

<script src="data/japeak-lessons.js"></script>
<script src="data/japeak-conversation.js"></script>
<script src="data/japeak-class.js"></script>
<script src="data/japeak-health.js"></script>
<script src="data/japeak-lunch.js"></script>
<script src="data/japeak-break.js"></script>
<script src="data/japeak-clubs.js"></script>
<script src="data/japeak-teachers.js"></script>
<script src="data/japeak-commuting.js"></script>
<script src="data/japeak-troubles.js"></script>
<script src="data/japeak-events.js"></script>
<script src="data/japeak-office.js"></script>
<script src="data/japeak-paragraphs.js"></script>
<script src="data/japeak-a1-s1.js"></script>
<script src="data/japeak-convenient-shopping.js"></script>
<script src="data/japeak-convenient-ordering.js"></script>
<script src="data/japeak-convenient-neighbor.js"></script>
<script src="data/japeak-convenient-visit-home.js"></script>
<script src="data/japeak-convenient-question.js"></script>
<script src="data/japeak-a1-buy-things.js"></script>

<script src="js/japeak-app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langData = [
                { code: 'en', native: 'English', jp: '英語' },
                { code: 'zh-CN', native: '简体中文', jp: '中国語（簡体字）' },
                { code: 'zh-TW', native: '繁體中文', jp: '中国語（繁体字）' },
                { code: 'ko', native: '한국어', jp: '韓国語' },
                { code: 'vi', native: 'Tiếng Việt', jp: 'ベトナム語' },
                { code: 'tl', native: 'Filipino', jp: 'フィリピノ語' },
                { code: 'id', native: 'Indonesia', jp: 'インドネシア語' },
                { code: 'th', native: 'ภาษาไทย', jp: 'タイ語' },
                { code: 'my', native: 'မြန်မာဘာသာ', jp: 'ミャンマー語' },
                { code: 'km', native: 'ខ្មែរ', jp: 'クメール語' },
                { code: 'ne', native: 'नेपाली', jp: 'ネパール語' },
                { code: 'mn', native: 'Монгол хэл', jp: 'モンгол語' },
                { code: 'si', native: 'සිංහල', jp: 'シンハラ語' },
                { code: 'bn', native: 'বাংলা ভাষা', jp: 'ベンガル語' },
                { code: 'pt', native: 'Português', jp: 'ポルトガル語' },
                { code: 'es', native: 'Español', jp: 'スペイン語' },
                { code: 'fr', native: 'Français', jp: 'フランス語' },
                { code: 'ru', native: 'Русский', jp: 'ロシア語' },
                { code: 'uk', native: 'Українська', jp: 'ウクライナ語' }
            ];

            const btn = document.getElementById('custom-lang-btn');
            const menu = document.getElementById('custom-lang-menu');
            const list = document.getElementById('custom-lang-list');
            const display = document.getElementById('custom-lang-display');
            const chevron = document.getElementById('custom-lang-chevron');
            const hiddenSelect = document.getElementById('lang-select');

            // リスト項目の生成
            langData.forEach(lang => {
                const li = document.createElement('li');
                li.className = "px-4 py-3 hover:bg-[#eef8ff] cursor-pointer border-b border-stone-100 last:border-0 transition-colors flex items-baseline gap-2 text-left";
                li.innerHTML = `<span class="text-base font-medium">${lang.native}</span> <span class="text-[10px] text-stone-500 font-bold mb-0.5">${lang.jp}</span>`;
                
                li.addEventListener('click', () => {
                    display.innerHTML = `<span>${lang.native}</span> <span class="text-[10px] font-normal opacity-90 mt-1">${lang.jp}</span>`;
                    
                    hiddenSelect.value = lang.code;
                    hiddenSelect.dispatchEvent(new Event('change'));
                    
                    closeMenu();
                });
                list.appendChild(li);
            });

            // 初期表示のセット
            setTimeout(() => {
                const currentCode = hiddenSelect.value;
                const currentLang = langData.find(l => l.code === currentCode) || langData[0];
                display.innerHTML = `<span>${currentLang.native}</span> <span class="text-[10px] font-normal opacity-90 mt-1">${currentLang.jp}</span>`;
            }, 100);

            function toggleMenu() {
                const isHidden = menu.classList.contains('hidden');
                if (isHidden) {
                    menu.classList.remove('hidden');
                    chevron.classList.add('rotate-180');
                } else {
                    closeMenu();
                }
            }

            function closeMenu() {
                menu.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });

            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !btn.contains(e.target)) {
                    closeMenu();
                }
            });
        });
    </script>
</body>
</html>
